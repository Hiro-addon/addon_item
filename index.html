<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
max-width:1000px;
margin:auto;
padding:24px 16px 50px;
}
h1{
margin:0;
font-size:28px;
}
.subtitle{
color:#999;
margin:6px 0 24px;
}
.section{
background:#191919;
border:1px solid #303030;
border-radius:14px;
padding:18px;
margin-bottom:18px;
}
.section h2{
font-size:19px;
margin:0 0 15px;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
label{
display:block;
font-size:13px;
color:#bbb;
margin-bottom:6px;
}
input,select,textarea{
width:100%;
background:#111;
border:1px solid #3a3a3a;
border-radius:9px;
color:#fff;
padding:10px 11px;
font-size:14px;
outline:none;
}
input:focus,select:focus,textarea:focus{
border-color:#777;
}
.required{
background:#222;
border:1px solid #3b3b3b;
border-radius:10px;
padding:13px;
}
.required-title{
font-weight:600;
margin-bottom:9px;
}
.component-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.component{
background:#202020;
border:1px solid #333;
border-radius:11px;
overflow:hidden;
}
.component.disabled{
opacity:.45;
}
.component-head{
display:flex;
align-items:center;
gap:9px;
padding:12px;
cursor:pointer;
}
.component-head input[type=checkbox]{
width:18px;
height:18px;
margin:0;
accent-color:#fff;
}
.component-name{
font-weight:600;
font-size:14px;
flex:1;
}
.version{
font-size:11px;
color:#999;
}
.component-body{
display:none;
padding:0 12px 12px;
border-top:1px solid #303030;
}
.component.active .component-body{
display:block;
}
.field{
margin-top:10px;
}
.small{
font-size:11px;
color:#888;
margin-top:5px;
}
.boolean-setting{
background:#171717;
border:1px solid #333;
border-radius:9px;
padding:10px;
margin-top:10px;
}
.boolean-setting label{
margin:0;
display:flex;
align-items:center;
gap:8px;
color:#ddd;
}
.boolean-setting input{
width:auto;
}
.digger-row{
display:grid;
grid-template-columns:1.5fr 1fr;
gap:8px;
margin-top:8px;
}
.repair-row,.ammo-row,.storage-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px;
}
.full{
grid-column:1/-1;
}
.add-row{
width:100%;
background:#292929;
border:1px dashed #555;
color:#ddd;
border-radius:9px;
padding:10px;
margin-top:10px;
cursor:pointer;
}
.add-row:hover{
background:#333;
}
.remove-row{
background:#2b2b2b;
border:1px solid #444;
color:#ddd;
border-radius:8px;
padding:0 12px;
cursor:pointer;
}
.generate{
width:100%;
border:0;
border-radius:11px;
background:#fff;
color:#000;
padding:14px;
font-weight:700;
font-size:15px;
cursor:pointer;
}
.result{
margin-top:14px;
position:relative;
}
.result textarea{
min-height:500px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
font-size:13px;
line-height:1.5;
resize:vertical;
}
.copy{
position:absolute;
right:10px;
top:10px;
background:#fff;
color:#000;
border:0;
border-radius:7px;
padding:7px 11px;
font-weight:600;
cursor:pointer;
}
.notice{
background:#181818;
border:1px solid #343434;
border-radius:9px;
padding:10px;
font-size:12px;
color:#aaa;
margin-bottom:12px;
}
.hidden{
display:none!important;
}
@media(max-width:700px){
.grid,.component-grid{
grid-template-columns:1fr;
}
.container{
padding:18px 12px 40px;
}
h1{
font-size:24px;
}
}
</style>
</head>
<body>

<div class="container">

<h1>Hiro Addon Tools</h1>
<div class="subtitle">Minecraft Bedrock Addon Item JSON Generator</div>

<div class="section">
<h2>基本設定</h2>

<div class="grid">

<div>
<label>フォーマットバージョン</label>
<select id="formatVersion">
<option value="1.20.0">1.20.0</option>
<option value="1.20.10">1.20.10</option>
<option value="1.20.30">1.20.30</option>
<option value="1.20.50">1.20.50</option>
<option value="1.21.0">1.21.0</option>
<option value="1.21.20">1.21.20</option>
<option value="1.21.40">1.21.40</option>
<option value="1.21.50">1.21.50</option>
<option value="1.21.90">1.21.90</option>
<option value="1.21.110">1.21.110</option>
<option value="1.21.120">1.21.120</option>
<option value="1.21.130">1.21.130</option>
<option value="1.26.0">1.26.0</option>
<option value="1.26.10">1.26.10</option>
<option value="1.26.30" selected>1.26.30</option>
</select>
</div>

<div>
<label>アイテムID</label>
<input id="itemId" value="hiro:test_item" placeholder="hiro:test_item">
</div>

<div>
<label>クリエイティブカテゴリ</label>
<select id="category">
<option value="items">items</option>
<option value="construction">construction</option>
<option value="nature">nature</option>
<option value="equipment">equipment</option>
<option value="none">none</option>
</select>
</div>

<div>
<label>クリエイティブグループ</label>
<input id="group" placeholder="itemGroup.name.example">
</div>

</div>
</div>

<div class="section">
<h2>基本コンポーネント</h2>

<div class="grid">

<div class="required">
<div class="required-title">アイコン</div>
<label>テクスチャ名</label>
<input id="iconTexture" value="test_item" placeholder="test_item">
</div>

<div class="required">
<div class="required-title">最大スタック数</div>
<label>1～64</label>
<input id="maxStack" type="number" min="1" max="64" value="64">
</div>

</div>
</div>

<div class="section">
<h2>コンポーネント</h2>

<div class="notice">
チェックしたコンポーネントだけJSONに追加されます。フォーマットバージョンに対応していないコンポーネントは自動的に使用不可になります。
</div>

<div id="components" class="component-grid"></div>

</div>

<div class="section">
<button class="generate" onclick="generate()">JSONを生成</button>

<div class="result">
<button class="copy" onclick="copyResult()">コピー</button>
<textarea id="result" readonly></textarea>
</div>
</div>

</div>

<script>

const conflicts=[
["food","shooter","throwable"],
["wearable","shooter","throwable"]

function versionNumber(v){
return v.split(".").map(Number);
}

function versionAtLeast(a,b){
const x=versionNumber(a);
const y=versionNumber(b);
for(let i=0;i<3;i++){
if((x[i]||0)>(y[i]||0)) return true;
if((x[i]||0)<(y[i]||0)) return false;
}
return true;
}

function getSelectedVersion(){
return document.getElementById("formatVersion").value;
}

function renderComponents(){
const root=document.getElementById("components");
root.innerHTML="";

for(const c of components){
const available=versionAtLeast(getSelectedVersion(),c.min);

const box=document.createElement("div");
box.className="component"+(available?"":" disabled");
box.dataset.id=c.id;

box.innerHTML=`
<div class="component-head">
<input type="checkbox" id="check_${c.id}" ${available?"":"disabled"}>
<div class="component-name">${c.name}</div>
<div class="version">1.${c.min.split(".").slice(1).join(".")}+</div>
</div>
<div class="component-body" id="body_${c.id}"></div>
`;

root.appendChild(box);

const checkbox=box.querySelector("input");

checkbox.addEventListener("change",()=>{
if(checkbox.checked){
box.classList.add("active");
}else{
box.classList.remove("active");
}
updateDependencies();
});

buildBody(c,box.querySelector(".component-body"));
}
}

function field(label,id,type="text",value="",placeholder=""){
return `
<div class="field">
<label>${label}</label>
<input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}">
</div>
`;
}

function checkboxField(id,label,checked=false){
return `
<div class="boolean-setting">
<label>
<input type="checkbox" id="${id}" ${checked?"checked":""}>
${label}
</label>
</div>
`;
}

function buildBody(c,body){
switch(c.type){

body.innerHTML=checkboxField(`value_${c.id}`,"有効にする",true);
break;

case"number":
body.innerHTML=field(c.label||"値",`value_${c.id}`,"number",c.default??0);

body.innerHTML=field("表示名","value_display_name","text","","例：§aひろのアイテム");
break;

field("カテゴリ","cooldown_category","text","default","cooldown")
+field("時間（秒）","cooldown_duration","number","1","1")
+`
<div class="field">
<label>発動種類</label>
<select id="cooldown_type">
<option value="use">use</option>
<option value="attack">attack</option>
</select>
</div>
`;

+field("耐久値減少 最大確率（%）","durability_max_chance","number","100","0～100");

`

<label>エンチャントタイプ</label>
<select id="enchant_slot">
<option value="all">all</option>
<option value="none">none</option>
<option value="g_armor">g_armor</option>

<option value="armor_torso">armor_torso</option>
<option value="armor_feet">armor_feet</option>
<option value="armor_legs">armor_legs</option>
<option value="sword">sword</option>
<option value="bow">bow</option>
<option value="spear">spear</option>
<option value="crossbow">crossbow</option>
<option value="melee_spear">melee_spear</option>
<option value="g_tool">g_tool</option>
<option value="hoe">hoe</option>
<option value="shears">shears</option>
<option value="flintsteel">flintsteel</option>
<option value="shield">shield</option>
<option value="g_digging">g_digging</option>
<option value="axe">axe</option>
<option value="pickaxe">pickaxe</option>
<option value="shovel">shovel</option>
<option value="fishing_rod">fishing_rod</option>
<option value="carrot_stick">carrot_stick</option>

function addDiggerRow(){
const root=document.getElementById("digger_rows");
const row=document.createElement("div");
row.className="digger-row";
row.innerHTML=`
<input class="digger-block" placeholder="minecraft:stone">
<input class="digger-time" type="number" min="0.01" step="0.01" placeholder="秒">
`;
root.appendChild(row);
}

function addRepairRow(){
const root=document.getElementById("repair_rows");
const row=document.createElement("div");
row.className="repair-row";
row.innerHTML=`
<input class="repair-items" placeholder="minecraft:iron_ingot, minecraft:iron_block">
<input class="repair-amount" type="number" min="0" step="0.1" placeholder="修理量">
`;
root.appendChild(row);
}

function addAmmoRow(){
const root=document.getElementById("ammo_rows");
const row=document.createElement("div");
row.className="ammo-row";
row.innerHTML=`
<input class="ammo-item" placeholder="minecraft:arrow">
<select class="ammo-search">
<option value="true">インベントリから探す</option>
<option value="false">探さない</option>
</select>
`;
root.appendChild(row);
}

function checked(id){
const el=document.getElementById("check_"+id);
return !!el&&el.checked;
}

function setChecked(id,value){
const el=document.getElementById("check_"+id);
if(!el||el.disabled)return;
el.checked=value;
const box=el.closest(".component");
if(value)box.classList.add("active");
else box.classList.remove("active");
}

function updateDependencies(){
for(const c of components){
if(!checked(c.id))continue;

if(c.requires){
for(const req of c.requires){
if(!checked(req)){
setChecked(req,true);
}
}
}
}

for(const group of conflicts){
const active=group.filter(id=>checked(id));

if(active.length>1){
for(let i=1;i<active.length;i++){
setChecked(active[i],false);
}
}
}

const food=checked("food");
const shooter=checked("shooter");
const throwable=checked("throwable");

if(food)setChecked("shooter",false);
if(food)setChecked("throwable",false);

if(shooter){
setChecked("food",false);
setChecked("throwable",false);
}

if(throwable){
setChecked("food",false);
setChecked("shooter",false);
}

if(checked("repairable"))setChecked("durability",true);
if(checked("food"))setChecked("use_modifiers",true);
if(checked("shooter")){
setChecked("use_modifiers",true);
setChecked("projectile",true);
}
if(checked("throwable"))setChecked("projectile",true);

const stack=document.getElementById("maxStack");

if(checked("wearable")){
const slot=document.getElementById("wearable_slot");
if(slot&&slot.value!=="slot.weapon.mainhand"&&slot.value!=="slot.weapon.offhand"){
stack.value=1;
}
}
}

function splitList(value){
return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);
}

function generate(){
updateDependencies();

const format=document.getElementById("formatVersion").value;
const identifier=document.getElementById("itemId").value.trim()||"hiro:test_item";
const category=document.getElementById("category").value;
const group=document.getElementById("group").value.trim();

const item={
format_version:format,
"minecraft:item":{
description:{
identifier,
menu_category:{
category
}
},
components:{
"minecraft:icon":{
texture:document.getElementById("iconTexture").value.trim()||"test_item"
},
"minecraft:max_stack_size":Math.min(
64,
Math.max(
1,
Number(document.getElementById("maxStack").value)||64
)
)
}
}
};

if(group){
item["minecraft:item"].description.menu_category.group=group;
}

const out=item["minecraft:item"].components;

if(checked("allow_off_hand"))
out["minecraft:allow_off_hand"]=true;

if(checked("can_destroy_in_creative"))
out["minecraft:can_destroy_in_creative"]=true;

if(checked("compostable"))
out["minecraft:compostable"]=Number(document.getElementById("value_compostable").value)||0;

if(checked("cooldown")){
out["minecraft:cooldown"]={
category:document.getElementById("cooldown_category").value||"default",
duration:Number(document.getElementById("cooldown_duration").value)||0
};

if(versionAtLeast(format,"1.21.130")){
out["minecraft:cooldown"].type=document.getElementById("cooldown_type").value;
}
}

if(checked("damage")){
out["minecraft:damage"]={
value:Math.max(0,Number(document.getElementById("value_damage").value)||0)
};
}

if(checked("damage_absorption")){
out["minecraft:damage_absorption"]={
absorption:Math.max(
0,
Number(document.getElementById("damage_absorption_amount").value)||0
)
};
}

if(checked("digger")){
const rows=[...document.querySelectorAll("#digger_rows .digger-row")];
const destroy_speeds=[];

for(const row of rows){
const block=row.querySelector(".digger-block").value.trim();
const seconds=Number(row.querySelector(".digger-time").value);

if(block&&seconds>0){
destroy_speeds.push({
block,
speed:Math.round((1/seconds)*100)/100
});
}
}

out["minecraft:digger"]={
destroy_speeds,
use_efficiency:document.getElementById("digger_efficiency").checked
};
}

if(checked("display_name")){
out["minecraft:display_name"]={
value:document.getElementById("value_display_name").value
};
}

if(checked("durability")){
out["minecraft:durability"]={
max_durability:Math.max(
0,
Number(document.getElementById("durability_max").value)||0
),
damage_chance:{
min:Math.max(
0,
Math.min(
100,
Number(document.getElementById("durability_min").value)||0
)
),
max:Math.max(
0,
Math.min(
100,
Number(document.getElementById("durability_max_chance").value)||0
)
)
}
};
}

if(checked("enchantable")){
out["minecraft:enchantable"]={
slot:document.getElementById("enchant_slot").value,
value:Math.max(
0,
Number(document.getElementById("enchant_value").value)||0
)
};
}

if(checked("fire_resistant"))
out["minecraft:fire_resistant"]=true;

if(checked("food")){
out["minecraft:food"]={
can_always_eat:document.getElementById("food_always").checked,
nutrition:Math.max(
0,
Number(document.getElementById("food_nutrition").value)||0
),
saturation_modifier:Number(
document.getElementById("food_saturation").value
)||0
};

const convert=document.getElementById("food_convert").value.trim();
if(convert){
out["minecraft:food"].using_converts_to=convert;
}
}

if(checked("fuel")){
out["minecraft:fuel"]={
duration:Math.max(
0.05,
Number(document.getElementById("fuel_duration").value)||0.05
)
};
}

if(checked("glint"))
out["minecraft:glint"]=true;

if(checked("hand_equipped"))
out["minecraft:hand_equipped"]=true;

if(checked("hover_text_color")){
out["minecraft:hover_text_color"]=
document.getElementById("hover_color").value.trim()||"white";
}

if(checked("interact_button")){
if(document.getElementById("interact_button_enabled").checked){
const text=document.getElementById("interact_button_text").value.trim();
out["minecraft:interact_button"]=text||true;
}else{
out["minecraft:interact_button"]=false;
}
}

if(checked("kinetic_weapon")){
out["minecraft:kinetic_weapon"]={
damage:Number(document.getElementById("kinetic_damage").value)||1,
knockback:Number(document.getElementById("kinetic_knockback").value)||1
};
}

if(checked("projectile")){
out["minecraft:projectile"]={
minimum_critical_power:Number(
document.getElementById("projectile_critical").value
)||0,
projectile_entity:
document.getElementById("projectile_entity").value.trim()||
"minecraft:arrow"
};
}

if(checked("rarity")){
out["minecraft:rarity"]=
document.getElementById("rarity_value").value;
}

if(checked("record")){
out["minecraft:record"]={
sound_event:document.getElementById("record_sound").value.trim()||"13",
duration:Number(document.getElementById("record_duration").value)||0,
comparator_signal:Math.min(
13,
Math.max(
1,
Number(document.getElementById("record_signal").value)||1
)
)
};
}

if(checked("repairable")){
const rows=[...document.querySelectorAll("#repair_rows .repair-row")];
const repair_items=[];

for(const row of rows){
const items=splitList(row.querySelector(".repair-items").value);
const amount=row.querySelector(".repair-amount").value;

if(items.length){
const entry={items};

if(amount!==""){
entry.repair_amount=Number(amount);
}

repair_items.push(entry);
}
}

out["minecraft:repairable"]={
repair_items
};
}

if(checked("shooter")){
const rows=[...document.querySelectorAll("#ammo_rows .ammo-row")];
const ammunition=[];

for(const row of rows){
const item=row.querySelector(".ammo-item").value.trim();

if(item){
ammunition.push({
item,
search_inventory:
row.querySelector(".ammo-search").value==="true"
});
}
}

out["minecraft:shooter"]={
ammunition
};
}

if(checked("storage_item")){
const obj={
max_slots:Math.min(
64,
Math.max(
1,
Number(document.getElementById("storage_max_slots").value)||64
)
),
allow_nested_storage_items:
document.getElementById("storage_nested").checked
};

const allowed=splitList(
document.getElementById("storage_allowed").value
);

const banned=splitList(
document.getElementById("storage_banned").value
);

if(allowed.length)obj.allowed_items=allowed;
if(banned.length)obj.banned_items=banned;

out["minecraft:storage_item"]=obj;
}

if(checked("storage_weight_limit")){
out["minecraft:storage_weight_limit"]=
Number(document.getElementById("value_storage_weight_limit").value)||0;
}

if(checked("storage_weight_modifier")){
out["minecraft:storage_weight_modifier"]=
Number(document.getElementById("value_storage_weight_modifier").value)||0;
}

if(checked("tags")){
out["minecraft:tags"]={
tags:splitList(document.getElementById("item_tags").value)
};
}

if(checked("throwable")){
out["minecraft:throwable"]={
do_swing_animation:
document.getElementById("throw_swing").checked,
launch_power_scale:
Number(document.getElementById("throw_launch_scale").value)||1,
max_launch_power:
Number(document.getElementById("throw_max_power").value)||1,
min_draw_duration:
Number(document.getElementById("throw_min_draw").value)||0,
max_draw_duration:
Number(document.getElementById("throw_max_draw").value)||0,
scale_power_by_draw_duration:
document.getElementById("throw_scale_charge").checked
};
}

if(checked("use_modifiers")){
const obj={
emit_vibrations:
document.getElementById("use_vibrations").checked,
use_duration:
Number(document.getElementById("use_duration").value)||0,
movement_modifier:
Number(document.getElementById("movement_modifier").value)||1
};

const sound=document.getElementById("use_start_sound").value.trim();
if(sound)obj.start_sound=sound;

if(versionAtLeast(format,"1.26.30")){
obj.start_using=
document.getElementById("use_start_using").value;
}

out["minecraft:use_modifiers"]=obj;
}

if(checked("wearable")){
out["minecraft:wearable"]={
slot:document.getElementById("wearable_slot").value,
protection:Math.max(
0,
Number(document.getElementById("wearable_protection").value)||0
),
hides_player_location:
document.getElementById("wearable_hides_location").checked,
dispensable:
document.getElementById("wearable_dispensable").checked
};
}

document.getElementById("result").value=
JSON.stringify(item,null,2);
}

function copyResult(){
const result=document.getElementById("result");
result.select();
result.setSelectionRange(0,999999);
navigator.clipboard.writeText(result.value);
}

document.getElementById("formatVersion").addEventListener("change",()=>{
renderComponents();
});

renderComponents();
</script>

</body>
</html>
