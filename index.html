<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.container{
max-width:1000px;
margin:auto;
padding:24px 16px 50px
}
h1{
margin:0;
font-size:28px
}
.subtitle{
color:#888;
margin:6px 0 24px
}
.section{
background:#181818;
border:1px solid #2a2a2a;
border-radius:14px;
padding:18px;
margin-bottom:16px
}
.section h2{
font-size:18px;
margin:0 0 14px
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
label{
display:block;
font-size:13px;
color:#aaa;
margin-bottom:6px
}
input,select,textarea{
width:100%;
background:#111;
border:1px solid #333;
border-radius:9px;
padding:10px;
color:#fff;
font-size:14px;
outline:none
}
input:focus,select:focus,textarea:focus{
border-color:#777
}
.required{
background:#202020;
border:1px solid #333;
border-radius:10px;
padding:12px
}
.required-title{
font-size:14px;
font-weight:600;
margin-bottom:8px
}
.component-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.component{
background:#202020;
border:1px solid #303030;
border-radius:10px;
overflow:hidden
}
.component-header{
padding:11px 12px;
display:flex;
align-items:center;
gap:9px;
cursor:pointer
}
.component-header input{
width:17px;
height:17px;
margin:0
}
.component-name{
font-size:14px;
font-weight:600
}
.version{
font-size:11px;
color:#888;
margin-left:auto
}
.component-body{
display:none;
padding:0 12px 12px
}
.component.active .component-body{
display:block
}
.boolean-setting{
background:#151515;
border:1px solid #303030;
border-radius:8px;
padding:10px;
margin-top:8px
}
.boolean-setting label{
margin:0;
display:flex;
align-items:center;
gap:8px;
color:#ddd
}
.boolean-setting input{
width:17px;
height:17px
}
.small{
font-size:11px;
color:#888;
margin-top:5px
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px
}
.full{
grid-column:1/-1
}
.add-row{
width:100%;
margin-top:8px;
padding:9px;
background:#222;
border:1px dashed #555;
color:#fff;
border-radius:8px;
cursor:pointer
}
.remove-row{
padding:8px 10px;
background:#222;
border:1px solid #444;
color:#fff;
border-radius:8px;
cursor:pointer
}
.generate{
width:100%;
border:0;
border-radius:10px;
padding:13px;
font-size:15px;
font-weight:700;
background:#fff;
color:#000;
cursor:pointer
}
.result{
margin-top:16px
}
.result textarea{
height:500px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
font-size:12px;
resize:vertical
}
.copy{
width:100%;
margin-top:8px;
padding:11px;
border-radius:9px;
border:1px solid #444;
background:#222;
color:#fff;
cursor:pointer
}
.disabled{
opacity:.4;
pointer-events:none
}
.notice{
font-size:12px;
color:#888;
margin-top:8px;
line-height:1.5
}
@media(max-width:700px){
.grid,.component-grid{
grid-template-columns:1fr
}
}
</style>
</head>
<body>

<div class="container">

<h1>Hiro Addon Tools</h1>

<h2>基本設定</h2>

<option value="1.21.40">1.21.40</option>
<option value="1.21.50">1.21.50</option>
<option value="1.21.90">1.21.90</option>
<option value="1.21.110">1.21.110</option>
<option value="1.21.120">1.21.120</option>

</div>

<div class="section">
<h2>基本コンポーネント</h2>

</div>

<div class="section">

<div class="result">
<textarea id="result" readonly></textarea>
<button class="copy" onclick="copyJSON()">JSONをコピー</button>
</div>
</div>

</div>

function versionNumber(v){
return v.split(".").map(Number);
}

function versionAtLeast(a,b){
const x=versionNumber(a);
const y=versionNumber(b);
for(let i=0;i<3;i++){
if((x[i]||0)>(y[i]||0)) return true;
if((x[i]||0)<(y[i]||0)) return false;
}
return true;
}

function getComponent(id){
return components.find(c=>c.id===id);
}

function renderComponents(){

const root=document.getElementById("components");
root.innerHTML="";

const version=document.getElementById("formatVersion").value;

components.forEach(c=>{

if(!versionAtLeast(version,c.min)) return;

const box=document.createElement("div");
box.className="component";
box.dataset.id=c.id;

const header=document.createElement("div");
header.className="component-header";

const check=document.createElement("input");
check.type="checkbox";
check.id="check_"+c.id;

const name=document.createElement("div");
name.className="component-name";
name.textContent=c.name;

const ver=document.createElement("div");
ver.className="version";
ver.textContent="≥ "+c.min;

header.appendChild(check);
header.appendChild(name);
header.appendChild(ver);

const body=document.createElement("div");
body.className="component-body";

createSettings(c,body);

box.appendChild(header);
box.appendChild(body);
root.appendChild(box);

check.addEventListener("change",()=>{

box.classList.toggle("active",check.checked);

updateDependencies();

});

});

updateDependencies();

}

function addInput(parent,labelText,id,type="text",value="",extra=""){

const wrap=document.createElement("div");

const label=document.createElement("label");
label.textContent=labelText;

const input=document.createElement("input");
input.id=id;
input.type=type;
input.value=value;

if(extra) input.placeholder=extra;

wrap.appendChild(label);
wrap.appendChild(input);
parent.appendChild(wrap);

return input;

}

const typeWrap=document.createElement("div");
typeWrap.style.marginTop="8px";

typeWrap.innerHTML=
'<label>発動タイプ</label>'+
'<select id="cooldown_type">'+
'<option value="use">使用</option>'+

body.innerHTML=

function addDiggerRow(parent){

remove.onclick=()=>row.remove();

function checked(id){

const el=document.getElementById("check_"+id);
return !!el&&el.checked;

}

function setChecked(id,value){

const el=document.getElementById("check_"+id);

if(!el) return;

el.checked=value;

el.dispatchEvent(new Event("change"));

}

function updateDependencies(){

const version=document.getElementById("formatVersion").value;

components.forEach(c=>{

const check=document.getElementById("check_"+c.id);

if(!check) return;

const box=check.closest(".component");

if(!versionAtLeast(version,c.min)){

check.checked=false;
box.classList.remove("active");
box.classList.add("disabled");

}else{

box.classList.remove("disabled");

}

});

components.forEach(c=>{

if(!checked(c.id)||!c.requires) return;

c.requires.forEach(req=>{

const required=getComponent(req);

if(required&&versionAtLeast(version,required.min)){

setChecked(req,true);

}

});

});

conflicts.forEach(group=>{

const active=group.filter(id=>checked(id));

if(active.length<=1) return;

const keep=active[0];

for(let i=1;i<active.length;i++){

setChecked(active[i],false);

}

});

}

document.getElementById("formatVersion").addEventListener("change",()=>{

renderComponents();

});

function value(id,defaultValue=""){

const el=document.getElementById(id);

return el?el.value:defaultValue;

}

function bool(id){

const el=document.getElementById(id);

return !!el&&el.checked;

}

function csv(value){

return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);

}

function generate(){

updateDependencies();

const version=document.getElementById("formatVersion").value;

const identifier=value("itemId","hiro:test_item");

const description={
identifier,
menu_category:{
category:value("category","items")
}
};

const group=value("group","");

if(group){
description.menu_category.group=group;
}

const json={
format_version:version,
"minecraft:item":{
description,
components:{
"minecraft:icon":{
texture:value("iconTexture","test_item")
},
"minecraft:max_stack_size":Math.min(
64,
Math.max(
1,
Number(value("maxStack",64))
)
)
}
}
};

const out=json["minecraft:item"].components;

components.forEach(c=>{

if(!checked(c.id)) return;

switch(c.id){

case"allow_off_hand":
out["minecraft:allow_off_hand"]=true;
break;

case"can_destroy_in_creative":
out["minecraft:can_destroy_in_creative"]=true;
break;

case"compostable":
out["minecraft:compostable"]={
compost_chance:Number(value("compost_chance",0.65))
};
break;

case"cooldown":
out["minecraft:cooldown"]={
category:value("cooldown_category","hiro_item"),
duration:Number(value("cooldown_duration",1)),
type:value("cooldown_type","use")
};
break;

case"damage":
out["minecraft:damage"]=Number(value("damage_value",1));
break;

case"damage_absorption":
out["minecraft:damage_absorption"]={
absorption:Number(value("damage_absorption_value",1))
};
break;

case"digger":{

const destroy_speeds=[];

document.querySelectorAll("#digger_rows .digger-row").forEach(row=>{

const inputs=row.querySelectorAll("input");

if(inputs.length<2) return;

const block=inputs[0].value.trim();
const seconds=Number(inputs[1].value);

if(!block||!seconds||seconds<=0) return;

destroy_speeds.push({
block,
speed:Math.round((1/seconds)*100)/100
});

});

out["minecraft:digger"]={
use_efficiency:bool("digger_efficiency"),
destroy_speeds
};

break;

}

case"display_name":
out["minecraft:display_name"]={
value:value("display_name_value","")
};
break;

case"durability":
out["minecraft:durability"]={
max_durability:Number(value("max_durability",100)),
damage_chance:{
min:Number(value("damage_chance_min",100)),
max:Number(value("damage_chance_max",100))
}
};
break;

case"enchantable":
out["minecraft:enchantable"]={
slot:value("enchant_slot","sword"),
value:Number(value("enchant_value",10))
};
break;

case"fire_resistant":
out["minecraft:fire_resistant"]={};
break;

case"food":{

const food={
nutrition:Number(value("food_nutrition",1)),
saturation_modifier:Number(value("food_saturation",0.6)),
can_always_eat:bool("food_always")
};

const convert=value("food_convert","");

if(convert){
food.using_converts_to=convert;
}

out["minecraft:food"]=food;

break;

}

case"fuel":
out["minecraft:fuel"]={
duration:Number(value("fuel_duration",10))
};
break;

case"glint":
out["minecraft:glint"]=true;
break;

case"hand_equipped":
out["minecraft:hand_equipped"]=true;
break;

case"hover_text_color":
out["minecraft:hover_text_color"]=value("hover_color","#FFFFFF");
break;

case"interact_button":
out["minecraft:interact_button"]=value("interact_text","使用");
break;

case"kinetic_weapon":
out["minecraft:kinetic_weapon"]={
reach:{
min:0,
max:Number(value("kinetic_reach",3))
},
damage_conditions:{
min_speed:Number(value("kinetic_min_speed",0)),
min_relative_speed:Number(value("kinetic_min_relative_speed",0))
}
};
break;

case"projectile":
out["minecraft:projectile"]={
projectile_entity:value(
"projectile_entity",
"minecraft:arrow"
),
minimum_critical_power:Number(
value("projectile_critical",0)
)
};
break;

case"rarity":
out["minecraft:rarity"]=value("rarity_value","common");
break;

case"record":
out["minecraft:record"]={
sound_event:value("record_sound","music_disc"),
duration:Number(value("record_duration",180)),
comparator_signal:Number(value("record_signal",1))
};
break;

case"repairable":{

const repair_items=[];

document.querySelectorAll("#repair_rows .row").forEach(row=>{

const inputs=row.querySelectorAll("input");

if(inputs.length<2) return;

const item=inputs[0].value.trim();
const amount=Number(inputs[1].value);

if(!item) return;

repair_items.push({
items:[item],
repair_amount:amount
});

});

out["minecraft:repairable"]={
repair_items
};

break;

}

case"shooter":

out["minecraft:shooter"]={
ammunition:[],
max_draw_duration:Number(
value("shooter_duration",1)
),
scale_power_by_draw_duration:bool("shooter_draw")
};

break;

case"storage_item":{

const obj={
max_slots:Number(value("storage_slots",64)),
allow_nested_storage_items:bool("storage_nested")
};

const allowed=csv(value("storage_allowed",""));
const banned=csv(value("storage_banned",""));

if(allowed.length)obj.allowed_items=allowed;
if(banned.length)obj.banned_items=banned;

out["minecraft:storage_item"]=obj;

break;

}

case"storage_weight_limit":
out["minecraft:storage_weight_limit"]=
Number(value("storage_weight_limit_value",64));
break;

case"storage_weight_modifier":
out["minecraft:storage_weight_modifier"]=
Number(value("storage_weight_modifier_value",1));
break;

case"tags":
out["minecraft:tags"]={
tags:csv(value("tags_value",""))
};
break;

case"throwable":
out["minecraft:throwable"]={
do_swing_animation:bool("throwable_swing"),
launch_power_scale:Number(value("throwable_power",1))
};
break;

case"use_modifiers":

out["minecraft:use_modifiers"]={
use_duration:Number(value("use_duration",1)),
movement_modifier:Number(value("movement_modifier",0.35)),
emit_vibrations:bool("use_emit")
};

break;

case"wearable":

out["minecraft:wearable"]={
slot:value("wearable_slot","head"),
protection:Number(value("wearable_protection",0))
};

break;

}

});

document.getElementById("result").value=
JSON.stringify(json,null,2);

}

function copyJSON(){

const text=document.getElementById("result").value;

if(!text) return;

navigator.clipboard.writeText(text);

}

renderComponents();

</script>
