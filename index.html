<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component.disabled{opacity:.45}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.component-body input,.component-body select,.component-body textarea{margin-bottom:8px}
.component-body label{margin-top:10px}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:end}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.digger-row input{margin:0}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>
</head>
<body>
<div class="container">
<h1>Hiro Addon Tools</h1>
<div class="subtitle">Minecraft Bedrock Addon Item JSON Generator</div>

<div class="section">
<h2>基本設定</h2>
<div class="grid">
<div class="field">
<label>フォーマットバージョン</label>
<select id="formatVersion">
<option value="1.20.0">1.20.0</option>
<option value="1.20.10">1.20.10</option>
<option value="1.20.30">1.20.30</option>
<option value="1.20.50">1.20.50</option>
<option value="1.21.0">1.21.0</option>
<option value="1.21.20">1.21.20</option>
<option value="1.21.40">1.21.40</option>
<option value="1.21.50">1.21.50</option>
<option value="1.21.90">1.21.90</option>
<option value="1.21.110">1.21.110</option>
<option value="1.21.120">1.21.120</option>
<option value="1.21.130">1.21.130</option>
<option value="1.26.0">1.26.0</option>
<option value="1.26.10">1.26.10</option>
<option value="1.26.30" selected>1.26.30</option>
</select>
</div>

<div class="field">
<label>アイテムID</label>
<input id="identifier" type="text" placeholder="hiro:test_item">
</div>

<div class="field">
<label>クリエイティブカテゴリ</label>
<select id="category">
<option value="none">なし</option>
<option value="items">アイテム</option>
<option value="equipment">装備</option>
<option value="nature">自然</option>
<option value="construction">建築</option>
</select>
</div>

<div class="field">
<label>クリエイティブグループ</label>
<input id="group" type="text" placeholder="空欄なら設定しない">
</div>
</div>
</div>

<div class="section">
<h2>基本コンポーネント</h2>

<div class="required">
<div class="required-title">minecraft:icon</div>
<div class="required-name">テクスチャ名</div>
<input id="iconTexture" type="text" placeholder="test_item">
<div class="help">resource_pack/textures/item_texture.json の texture_data に登録した名前</div>
</div>

<div class="required">
<div class="required-title">minecraft:max_stack_size</div>
<div class="required-name">最大スタック数</div>
<input id="maxStack" type="number" min="1" max="64" value="64">
</div>
</div>

<div class="section">
<h2>使うコンポーネント</h2>
<div id="componentGrid" class="component-grid"></div>
</div>

<button class="generate" id="generate">JSONを生成</button>

<div class="result">
<div class="result-box">
<div class="result-title">
<span>生成結果</span>
<button class="copy-btn" id="copy">コピー</button>
</div>
<pre id="result">{}</pre>
</div>
</div>
</div>

const version = v => v.split(".").map(Number);
const ge = (a,b) => {
const x=version(a),y=version(b);
for(let i=0;i<3;i++){
if((x[i]||0)>(y[i]||0)) return true;
if((x[i]||0)<(y[i]||0)) return false;
}
return true;
};

const grid=document.getElementById("componentGrid");

function renderComponents(){
grid.innerHTML="";

const selected=document.getElementById("formatVersion").value;

components.forEach(c=>{
if(!ge(selected,c.min)) return;

const div=document.createElement("div");
div.className="component";
div.dataset.id=c.id;

div.innerHTML=`
<div class="component-head">
<input type="checkbox" data-component="${c.id}">
<div class="component-name">${c.name}</div>
<div class="component-version">≥ ${c.min}</div>
</div>
<div class="component-body"></div>
`;

grid.appendChild(div);

const checkbox=div.querySelector("input");
const body=div.querySelector(".component-body");

checkbox.addEventListener("change",()=>{
div.classList.toggle("active",checkbox.checked);
renderBody(c,body);
updateDependencies();
});
});
}

function input(id,label,type="text",value="",placeholder=""){
return `
<div class="field">
<label>${label}</label>
<input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}">
</div>`;
}

function booleanBox(id,label,checked=false){
return `
<div class="boolean-setting">
<input id="${id}" type="checkbox" ${checked?"checked":""}>
<span>${label}</span>
</div>`;
}

function renderBody(c,body){
let html="";

if(c.type==="boolean"){
html=booleanBox(c.id+"_value","有効にする");
}

if(c.type==="number"){
html=input(c.id+"_value","数値","number","1");
}

if(c.type==="text"){
html=input(c.id+"_value","設定値","text","","文字を入力");
}

if(c.type==="color"){
html=input(c.id+"_value","色","text","white","white");
}

if(c.type==="display_name"){
html=input(c.id+"_value","表示名","text","","例：§bひろのアイテム");
}

if(c.type==="compostable"){
html=input(c.id+"_value","堆肥化確率","number","0.65");
html+=`<div class="help">0.0～1.0の範囲で設定します。</div>`;
}

if(c.type==="cooldown"){
html=input(c.id+"_category","カテゴリ","text","hiro_item");
html+=input(c.id+"_duration","時間（秒）","number","1");
html+=`
<label>発動方法</label>
<select id="${c.id}_type">
<option value="use">使用</option>
<option value="attack">攻撃</option>
</select>`;
}

if(c.type==="digger"){
html=`
<div class="boolean-setting">
<input id="minecraft:digger_efficiency" type="checkbox">
<span>効率強化を使用する</span>
</div>
<div class="sub-title">破壊設定</div>
<div id="diggerRows"></div>
<button type="button" class="add-row" id="addDigger">＋ ブロックを追加</button>
<div class="help">ブロックIDはカンマ区切りで複数指定できます。秒数から採掘速度を計算します。</div>
`;
body.innerHTML=html;

const rows=document.getElementById("diggerRows");
const add=document.getElementById("addDigger");

function addRow(){
const row=document.createElement("div");
row.className="digger-row";

row.innerHTML=`
<div>
<div class="digger-label">ブロックID</div>
<input class="digger-block" type="text" placeholder="minecraft:stone,minecraft:coal_ore">
</div>
<div>
<div class="digger-label">破壊時間（秒）</div>
<input class="digger-seconds" type="number" min="0.01" step="0.01" value="1">
</div>
<button type="button" class="remove-row">×</button>
`;

row.querySelector(".remove-row").onclick=()=>{
row.remove();
};

rows.appendChild(row);
}

add.onclick=addRow;
addRow();
return;
}

if(c.type==="durability"){
html=input(c.id+"_max","最大耐久値","number","100");
html+=input(c.id+"_damage_min","ダメージ確率 最小","number","0");
html+=input(c.id+"_damage_max","ダメージ確率 最大","number","100");
}

<div class="sub-title">耐久値しきい値</div>
<div id="sensorRows"></div>
<button type="button" class="add-row" id="addSensor">＋ しきい値を追加</button>
`;

const add=document.getElementById("addSensor");

${input("sensor_durability_"+Date.now(),"耐久値","number","10")}

<div class="help">複数指定する場合はカンマ区切りです。</div>
</div>
`;

if(c.type==="swing_sounds"){
html=input(c.id+"_attack","攻撃音","text","","");
html+=input(c.id+"_use","使用音","text","","");
}

if(c.type==="tags"){
html=`

if(c.type==="wearable"){

html+=input(c.id+"_protection","防御力","number","0");

if(c.type==="block_placer"){

html+=booleanBox(c.id+"_replace","アイテムIDと同じブロックとして登録");
html+=`

function updateDependencies(){
const selected=new Set(
[...document.querySelectorAll("[data-component]:checked")]
.map(e=>e.dataset.component)
);

document.querySelectorAll(".component").forEach(box=>{
const cb=box.querySelector("[data-component]");
if(!cb)return;

cb.disabled=false;
box.classList.remove("disabled");

if(cb.dataset.component==="minecraft:durability_sensor" &&
!selected.has("minecraft:durability")){
cb.disabled=true;
box.classList.add("disabled");
}

if(cb.dataset.component==="minecraft:storage_item"){
}

if(cb.dataset.component==="minecraft:food" &&
!selected.has("minecraft:use_modifiers")){
}

if(cb.dataset.component==="minecraft:bundle_interaction"){
cb.disabled=true;
box.classList.add("disabled");
}
});
}

function csv(value){
return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);
}

function get(id){
const e=document.getElementById(id);
return e?e.value:"";
}

function checked(id){
const e=document.getElementById(id);
return !!e&&e.checked;
}

function getComponent(id){
return document.querySelector(`[data-component="${id}"]`);
}

function addComponent(out,id,value){
const checkbox=getComponent(id);
if(checkbox&&checkbox.checked) out[id]=value;
}

function generate(){
const format=document.getElementById("formatVersion").value;
const identifier=document.getElementById("identifier").value.trim();
const category=document.getElementById("category").value;
const group=document.getElementById("group").value.trim();

if(!identifier){
alert("アイテムIDを入力してください。");
return;
}

if(!identifier.includes(":")){
alert("アイテムIDには名前空間を付けてください。例：hiro:test_item");
return;
}

const result={
format_version:format,
"minecraft:item":{
description:{
identifier:identifier
},
components:{
"minecraft:icon":{
texture:get("iconTexture").trim()||"test_item"
},
"minecraft:max_stack_size":Math.min(64,Math.max(1,Number(get("maxStack"))||64))
}
}
};

const desc=result["minecraft:item"].description;

if(category!=="none"){
desc.menu_category={category};
if(group)desc.menu_category.group=group;
}else if(group){
desc.menu_category={category:"none",group};
}

const c=result["minecraft:item"].components;

addComponent(c,"minecraft:allow_off_hand",true);
addComponent(c,"minecraft:can_destroy_in_creative",true);
addComponent(c,"minecraft:fire_resistant",true);
addComponent(c,"minecraft:glint",true);
addComponent(c,"minecraft:hand_equipped",true);
addComponent(c,"minecraft:liquid_clipped",true);
addComponent(c,"minecraft:should_despawn",true);
addComponent(c,"minecraft:stacked_by_data",true);

if(getComponent("minecraft:damage")?.checked){
c["minecraft:damage"]=Math.max(0,Number(get("minecraft:damage_value"))||0);
}

if(getComponent("minecraft:damage_absorption")?.checked){
c["minecraft:damage_absorption"]=Math.max(0,Number(get("minecraft:damage_absorption_value"))||0);
}

if(getComponent("minecraft:display_name")?.checked){
c["minecraft:display_name"]={
value:get("minecraft:display_name_value")
};
}

if(getComponent("minecraft:compostable")?.checked){
c["minecraft:compostable"]={
compost_chance:Math.min(1,Math.max(0,Number(get("minecraft:compostable_value"))||0))
};
}

if(getComponent("minecraft:cooldown")?.checked){
const obj={
category:get("minecraft:cooldown_category")||"hiro_item",
duration:Math.max(0,Number(get("minecraft:cooldown_duration"))||0)
};
if(ge(format,"1.21.130")){
obj.type=get("minecraft:cooldown_type")||"use";
}
c["minecraft:cooldown"]=obj;
}

if(getComponent("minecraft:digger")?.checked){
const rows=[...document.querySelectorAll(".digger-row")];
const destroy_speeds=[];

rows.forEach(row=>{
const ids=csv(row.querySelector(".digger-block")?.value||"");
const seconds=Math.max(0.01,Number(row.querySelector(".digger-seconds")?.value)||1);
const speed=Math.max(0.01,Math.round((1/seconds)*100)/100);

ids.forEach(block=>{
destroy_speeds.push({
block,
speed
});
});
});

c["minecraft:digger"]={
use_efficiency:checked("minecraft:digger_efficiency"),
destroy_speeds
};
}

if(getComponent("minecraft:durability")?.checked){
const max=Math.max(1,Math.floor(Number(get("minecraft:durability_max"))||100));
const min=Math.max(0,Math.min(100,Number(get("minecraft:durability_damage_min"))||0));
const maxChance=Math.max(min,Math.min(100,Number(get("minecraft:durability_damage_max"))||100));

c["minecraft:durability"]={
max_durability:max,
damage_chance:{
min,
max:maxChance
}
};
}

if(getComponent("minecraft:durability_sensor")?.checked){
const rows=[...document.querySelectorAll("#sensorRows .required")];
const thresholds=[];

rows.forEach(row=>{
const inputs=row.querySelectorAll("input");
const durability=Math.max(0,Math.floor(Number(inputs[0]?.value)||0));
const particle=inputs[1]?.value.trim();
const sound=inputs[2]?.value.trim();

const obj={durability};

if(particle)obj.particle_type=particle;
if(sound)obj.sound_event=sound;

thresholds.push(obj);
});

if(thresholds.length){
c["minecraft:durability_sensor"]={
durability_thresholds:thresholds
};
}
}

if(getComponent("minecraft:dyeable")?.checked){
c["minecraft:dyeable"]={
default_color:get("minecraft:dyeable_default")||"white"
};
}

if(getComponent("minecraft:enchantable")?.checked){
c["minecraft:enchantable"]={
slot:get("minecraft:enchantable_slot"),
value:Math.max(0,Math.floor(Number(get("minecraft:enchantable_value"))||0))
};
}

if(getComponent("minecraft:food")?.checked){
if(!getComponent("minecraft:use_modifiers")?.checked){
alert("食べ物を使うには「使用時間・移動速度」も有効にしてください。");
return;
}

const food={
nutrition:Math.max(0,Math.floor(Number(get("minecraft:food_nutrition"))||0)),
saturation_modifier:Math.max(0,Number(get("minecraft:food_saturation"))||0),
can_always_eat:checked("minecraft:food_always")
};

const convert=get("minecraft:food_convert").trim();
if(convert)food.using_converts_to=convert;

c["minecraft:food"]=food;
}

if(getComponent("minecraft:fuel")?.checked){
c["minecraft:fuel"]={
duration:Math.max(0,Number(get("minecraft:fuel_duration"))||0)
};
}

if(getComponent("minecraft:hover_text_color")?.checked){
c["minecraft:hover_text_color"]=get("minecraft:hover_text_color_value")||"white";
}

if(getComponent("minecraft:interact_button")?.checked){
c["minecraft:interact_button"]=get("minecraft:interact_button_value")||"";
}

if(getComponent("minecraft:rarity")?.checked){
c["minecraft:rarity"]=get("minecraft:rarity_value");
}

if(getComponent("minecraft:record")?.checked){
const record={};
const sound=get("minecraft:record_sound").trim();
const duration=Number(get("minecraft:record_duration"));

if(sound)record.comparator_signal=0;
if(sound)record.sound_event=sound;
if(duration)record.duration=duration;

c["minecraft:record"]=record;
}

if(getComponent("minecraft:repairable")?.checked){
const items=csv(get("minecraft:repairable_items"));
if(items.length){
c["minecraft:repairable"]={
repair_items:[
{
items,
repair_amount:Math.max(1,Number(get("minecraft:repairable_amount"))||1)
}
]
};
}
}

if(getComponent("minecraft:storage_item")?.checked){
const storage={
max_slots:Math.min(64,Math.max(1,Math.floor(Number(get("minecraft:storage_item_slots"))||64))),
allow_nested_storage_items:checked("minecraft:storage_item_nested")
};

const allowed=csv(get("minecraft:storage_item_allowed"));
const banned=csv(get("minecraft:storage_item_banned"));

if(allowed.length)storage.allowed_items=allowed;
if(banned.length)storage.banned_items=banned;

c["minecraft:storage_item"]=storage;
}

if(getComponent("minecraft:storage_weight_limit")?.checked){
c["minecraft:storage_weight_limit"]=
Math.max(0,Number(get("minecraft:storage_weight_limit_value"))||0);
}

if(getComponent("minecraft:storage_weight_modifier")?.checked){
c["minecraft:storage_weight_modifier"]=
Math.max(0,Number(get("minecraft:storage_weight_modifier_value"))||0);
}

if(getComponent("minecraft:swing_duration")?.checked){
c["minecraft:swing_duration"]=
Math.max(0,Number(get("minecraft:swing_duration_value"))||0);
}

if(getComponent("minecraft:swing_sounds")?.checked){
const swing={};
const attack=get("minecraft:swing_sounds_attack").trim();
const use=get("minecraft:swing_sounds_use").trim();

if(attack)swing.attack=attack;
if(use)swing.use=use;

c["minecraft:swing_sounds"]=swing;
}

if(getComponent("minecraft:tags")?.checked){
const tags=csv(get("minecraft:tags_value"));
if(tags.length)c["minecraft:tags"]={tags};
}

if(getComponent("minecraft:throwable")?.checked){
c["minecraft:throwable"]={
do_swing:checked("minecraft:throwable_do_swing"),
launch_power_scale:Math.max(0,Number(get("minecraft:throwable_scale"))||1),
max_draw_duration:Math.max(0,Number(get("minecraft:throwable_max_draw"))||0)
};
}

if(getComponent("minecraft:use_animation")?.checked){
c["minecraft:use_animation"]=get("minecraft:use_animation_value");
}

if(getComponent("minecraft:use_modifiers")?.checked){
c["minecraft:use_modifiers"]={
use_duration:Math.max(0,Number(get("minecraft:use_modifiers_duration"))||0),
movement_modifier:Math.max(0,Number(get("minecraft:use_modifiers_movement"))||0)
};
}

if(getComponent("minecraft:wearable")?.checked){
const wearable={
slot:get("minecraft:wearable_slot")
};

const protection=Math.max(0,Number(get("minecraft:wearable_protection"))||0);
if(protection)wearable.protection=protection;

c["minecraft:wearable"]=wearable;
}

if(getComponent("minecraft:block_placer")?.checked){
const block=get("minecraft:block_placer_block").trim();

if(block){
const placer={block};

if(checked("minecraft:block_placer_replace")){
placer.replace_block_item=true;
}

const useOn=csv(get("minecraft:block_placer_useon"));

if(useOn.length){
placer.use_on=useOn;
}

c["minecraft:block_placer"]=placer;
}
}

document.getElementById("result").textContent=
JSON.stringify(result,null,2);
}

document.getElementById("formatVersion").addEventListener("change",()=>{
renderComponents();
});

document.getElementById("generate").addEventListener("click",generate);

document.getElementById("copy").addEventListener("click",async()=>{
const text=document.getElementById("result").textContent;
try{
await navigator.clipboard.writeText(text);
const btn=document.getElementById("copy");
const old=btn.textContent;
btn.textContent="コピーしました";
setTimeout(()=>btn.textContent=old,1200);
}catch{
alert("コピーできませんでした。");
}
});

renderComponents();
</script>
</body>
</html>
