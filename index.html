<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiro Addon Tools - Item JSON Generator</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#111;
color:#eee;
padding:20px
}
.container{
max-width:1000px;
margin:auto
}
h1{
font-size:26px;
margin:0 0 20px
}
h2{
font-size:18px;
margin:0 0 12px
}
.card{
background:#1b1b1b;
border:1px solid #333;
border-radius:12px;
padding:16px;
margin-bottom:16px
}
label{
display:block;
font-size:13px;
color:#bbb;
margin-bottom:6px
}
input,select,textarea{
width:100%;
background:#101010;
color:#fff;
border:1px solid #444;
border-radius:8px;
padding:10px;
font-size:14px;
outline:none
}
input:focus,select:focus,textarea:focus{
border-color:#777
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.field{
margin-bottom:12px
}
button{
border:0;
border-radius:8px;
padding:10px 14px;
background:#333;
color:#fff;
font-weight:600;
cursor:pointer
}
button:hover{
background:#444
}
.primary{
background:#fff;
color:#000
}
.primary:hover{
background:#ddd
}
.actions{
display:flex;
gap:10px;
flex-wrap:wrap
}
.component{
border:1px solid #333;
border-radius:10px;
margin-bottom:10px;
overflow:hidden;
background:#151515
}
.component.active{
border-color:#666
}
.component-head{
display:flex;
align-items:center;
gap:10px;
padding:12px
}
.component-head>input{
width:auto;
flex:none
}
.component-name{
font-weight:600;
flex:1
}
.component-id{
font-size:10px;
color:#666;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}
.version{
font-size:11px;
color:#777;
white-space:nowrap
}
.component-body{
display:none;
padding:12px;
border-top:1px solid #333
}
.component.active .component-body{
display:block
}
.help{
font-size:12px;
color:#999;
margin-bottom:12px;
line-height:1.5
}
.boolean-setting{
display:flex;
align-items:center;
gap:8px;
margin:8px 0
}
.boolean-setting input{
width:auto
}
.sub-title{
font-weight:600;
font-size:13px;
margin:14px 0 8px
}
.required{
font-size:11px;
color:#aaa;
margin-left:6px
}
.digger-row{
display:grid;
grid-template-columns:1fr 180px 40px;
gap:8px;
margin-bottom:8px;
align-items:end
}
.digger-label{
font-size:11px;
color:#999;
margin-bottom:5px
}
.add-row{
margin-top:4px
}
.remove-row{
height:38px;
padding:0;
font-size:20px
}
.result{
background:#0a0a0a;
border:1px solid #333;
border-radius:10px;
padding:14px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
font-size:12px;
line-height:1.5;
white-space:pre-wrap;
word-break:break-word;
min-height:100px
}
@media(max-width:700px){
body{
padding:12px
}
.row{
grid-template-columns:1fr
}
.digger-row{
grid-template-columns:1fr 1fr 40px
}
.version{
display:none
}
.component-id{
max-width:35%;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}
}
</style>
</head>

function versionNumber(v){
return v.split(".").map(Number).reduce((a,n)=>a*1000+n,0);
}

function available(c,version){
const v=versionNumber(version);
const min=versionNumber(c.min);
const max=c.max?versionNumber(c.max):Infinity;
return v>=min&&v<=max;
}

function addCheckbox(parent,label,checked=false){
const wrap=document.createElement("div");
wrap.className="boolean-setting";

const input=document.createElement("input");
input.type="checkbox";
input.checked=checked;

const span=document.createElement("span");
span.textContent=label;

wrap.appendChild(input);
wrap.appendChild(span);
parent.appendChild(wrap);

return input;
}

function addInput(parent,label,value="",type="text",placeholder=""){
const wrap=document.createElement("div");
wrap.className="field";

const l=document.createElement("label");
l.textContent=label;

const input=document.createElement("input");
input.type=type;
input.value=value;
input.placeholder=placeholder;

wrap.appendChild(l);
wrap.appendChild(input);
parent.appendChild(wrap);

return input;
}

function addSelect(parent,label,options,value){
const wrap=document.createElement("div");
wrap.className="field";

const l=document.createElement("label");
l.textContent=label;

const select=document.createElement("select");

options.forEach(o=>{
const option=document.createElement("option");
option.value=o[0];
option.textContent=o[1];
if(o[0]===value)option.selected=true;
select.appendChild(option);
});

wrap.appendChild(l);
wrap.appendChild(select);
parent.appendChild(wrap);

return select;
}

function splitValues(value){
return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);
}

function parseJson(value,fallback={}){
try{
return JSON.parse(value);
}catch{
return fallback;
}
}

function createDiggerRow(container,blockValue="",secondsValue=1){

const row=document.createElement("div");
row.className="digger-row";

const blockWrap=document.createElement("div");

const blockLabel=document.createElement("div");
blockLabel.className="digger-label";
blockLabel.textContent="対象ブロックID（,で複数指定）";

const block=document.createElement("input");
block.type="text";
block.placeholder="minecraft:stone,minecraft:dirt";
block.value=blockValue;
block.dataset.diggerField="block";

blockWrap.appendChild(blockLabel);
blockWrap.appendChild(block);

const timeWrap=document.createElement("div");

const timeLabel=document.createElement("div");
timeLabel.className="digger-label";
timeLabel.textContent="破壊時間（秒）";

const seconds=document.createElement("input");
seconds.type="number";
seconds.min="0.01";
seconds.step="0.01";
seconds.value=secondsValue;
seconds.dataset.diggerField="seconds";

timeWrap.appendChild(timeLabel);
timeWrap.appendChild(seconds);

const remove=document.createElement("button");
remove.type="button";
remove.className="remove-row";
remove.textContent="×";
remove.onclick=()=>row.remove();

row.appendChild(blockWrap);
row.appendChild(timeWrap);
row.appendChild(remove);

container.appendChild(row);
}

function createFields(c,parent){

if(c.type==="boolean"||c.type==="empty"){
const input=addCheckbox(parent,"有効にする",c.default);
input.dataset.field="value";
return;
}

if(c.type==="number"){
const input=addInput(parent,"値",c.default,"number");
input.dataset.field="value";
return;
}

if(c.type==="text"){
const input=addInput(parent,"値",c.default);
input.dataset.field="value";
return;
}

if(c.type==="block_placer"){

const block=addInput(
parent,
"設置するブロックID",
"",
"text",
"minecraft:stone"
);
block.dataset.field="block";

const useOn=addInput(
parent,

"",
"text",
"minecraft:grass,minecraft:dirt"
);
useOn.dataset.field="use_on";

const aligned=addCheckbox(
parent,
"配置位置を揃える",
false
);
aligned.dataset.field="aligned_placement";

const replace=addCheckbox(
parent,
"このブロックのアイテムとして扱う",
false
);
replace.dataset.field="replace_block_item";

return;
}

if(c.type==="cooldown"){

const category=addInput(
parent,
"クールダウンのグループ名",
"example"
);
category.dataset.field="category";

const duration=addInput(
parent,
"クールダウン時間（秒）",
1,
"number"
);
duration.dataset.field="duration";

const version=versionNumber(
document.getElementById("formatVersion").value
);

if(version>=versionNumber("1.21.130")){

const type=addSelect(
parent,
"クールダウンが発生する動作",
[
["use","使用"],
["attack","攻撃"]
],
"use"
);

type.dataset.field="type";

}

return;
}

if(c.type==="digger"){

const efficiency=addCheckbox(
parent,
"効率強化を使用",
c.default.use_efficiency
);
efficiency.dataset.field="use_efficiency";

const title=document.createElement("div");
title.className="sub-title";
title.textContent="破壊設定";
parent.appendChild(title);

const rows=document.createElement("div");
rows.className="digger-rows";
parent.appendChild(rows);

createDiggerRow(rows,"minecraft:stone",1);

const add=document.createElement("button");

function renderComponents(){

const version=
document.getElementById("formatVersion").value;

const container=
document.getElementById("components");

container.innerHTML="";

components
.filter(c=>available(c,version))
.forEach(c=>{

const box=document.createElement("div");
box.className="component";
box.dataset.componentId=c.id;

const head=document.createElement("div");
head.className="component-head";

const check=document.createElement("input");
check.type="checkbox";

const name=document.createElement("div");
name.className="component-name";
name.textContent=c.name;

const id=document.createElement("div");
id.className="component-id";
id.textContent=c.id;

const ver=document.createElement("div");
ver.className="version";
ver.textContent=
c.max
?`${c.min} ～ ${c.max}`
:`${c.min} ～`;

head.appendChild(check);
head.appendChild(name);
head.appendChild(id);
head.appendChild(ver);

const body=document.createElement("div");
body.className="component-body";

const help=document.createElement("div");
help.className="help";
help.textContent=c.help;

body.appendChild(help);

createFields(c,body);

check.addEventListener("change",()=>{
box.classList.toggle("active",check.checked);
});

box.appendChild(head);
box.appendChild(body);

container.appendChild(box);

});

}

function collectComponent(c,box){

if(c.type==="boolean"||c.type==="empty"){
return box.querySelector('[data-field="value"]').checked;
}

if(c.type==="number"){
return Number(
box.querySelector('[data-field="value"]').value
);
}

if(c.type==="text"){
return{
value:box.querySelector('[data-field="value"]').value
};
}

if(c.type==="block_placer"){

const block=
box.querySelector('[data-field="block"]').value.trim();

const useOn=
splitValues(
box.querySelector('[data-field="use_on"]').value
);

const output={};

if(block){
output.block=block;
}

if(useOn.length){
output.use_on=useOn;
}

const aligned=
box.querySelector('[data-field="aligned_placement"]');

if(aligned){
output.aligned_placement=aligned.checked;
}

const replace=
box.querySelector('[data-field="replace_block_item"]');

if(replace){
output.replace_block_item=replace.checked;
}

return output;
}

if(c.type==="cooldown"){

const output={
category:
box.querySelector('[data-field="category"]').value,
duration:
Number(
box.querySelector('[data-field="duration"]').value
)
};

const type=
box.querySelector('[data-field="type"]');

if(type){
output.type=type.value;
}

return output;
}

if(c.type==="digger"){

const rows=
box.querySelectorAll(".digger-row");

const destroy_speeds=[];

rows.forEach(row=>{

const blocks=
splitValues(
row.querySelector(
'[data-digger-field="block"]'
).value
);

const seconds=
Number(
row.querySelector(
'[data-digger-field="seconds"]'
).value
);

if(
blocks.length===0||
!Number.isFinite(seconds)||
seconds<=0
)return;

const speed=
Math.round((1/seconds)*100)/100;

blocks.forEach(block=>{
destroy_speeds.push({
block:block,
speed:speed
});
});

});

return{
destroy_speeds:destroy_speeds,
use_efficiency:
box.querySelector(
'[data-field="use_efficiency"]'
).checked
};

}

if(c.type==="durability"){

return{
max_durability:
Number(
box.querySelector(
'[data-field="max_durability"]'
).value
),
damage_chance:{
min:
Number(
box.querySelector(
'[data-field="damage_min"]'
).value
),
max:
Number(
box.querySelector(
'[data-field="damage_max"]'
).value
)
}
};

}

if(c.type==="durability_sensor"){

const text=
box.querySelector(
'[data-field="thresholds"]'
).value;

const durability_thresholds=[];

text.split("\n").forEach(line=>{

const parts=line.split(":");

if(parts.length<2)return;

const threshold=
Number(parts[0]);

const event=
parts.slice(1).join(":").trim();

if(
Number.isFinite(threshold)&&
event
){
durability_thresholds.push({
threshold:threshold,
event:event
});
}

});

return{
durability_thresholds:
durability_thresholds
};

}

box.querySelector(

function generate(){

const identifier=
document.getElementById("identifier").value.trim()
||"hiro:test_item";

const format_version=
document.getElementById("formatVersion").value;

const icon=
document.getElementById("iconTexture").value.trim()
||"test_item";

let maxStack=
Number(
document.getElementById("maxStack").value
);

if(!Number.isFinite(maxStack)){
maxStack=64;
}

maxStack=
Math.max(
1,
Math.min(
64,
Math.floor(maxStack)
)
);

const category=
document.getElementById("category").value;

const group=
document.getElementById("group").value.trim();

const description={
identifier:identifier
};

if(category!=="none"||group){

description.menu_category={};

if(category!=="none"){
description.menu_category.category=category;
}

if(group){
description.menu_category.group=group;
}

}

const componentsOutput={
"minecraft:icon":{
texture:icon
},
"minecraft:max_stack_size":maxStack
};

document
.querySelectorAll(".component.active")
.forEach(box=>{

const c=
components.find(
component=>
component.id===box.dataset.componentId
);

if(!c)return;

componentsOutput[c.id]=
collectComponent(c,box);

});

const output={
format_version:format_version,
"minecraft:item":{
description:description,
components:componentsOutput
}
};

document.getElementById("result").textContent=
JSON.stringify(output,null,2);

}

document
.getElementById("formatVersion")
.addEventListener(
"change",
renderComponents
);

document
.getElementById("generate")
.addEventListener(
"click",
generate
);

document
.getElementById("copy")
.addEventListener(
"click",
async()=>{

const text=
document.getElementById("result").textContent;

if(!text)return;

try{

await navigator.clipboard.writeText(text);

const button=
document.getElementById("copy");

const old=
button.textContent;

button.textContent="コピーしました！";

setTimeout(()=>{
button.textContent=old;
},1200);

}catch{

alert("コピーに失敗しました");

}

});

renderComponents();

</script>
