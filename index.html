<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component.disabled{opacity:.45}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-name{font-size:14px;word-break:break-word}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:5px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.remove-row{width:100%;padding:9px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
}
</style>
</head>

function versionParts(v){
return v.split(".").map(Number);
}

function versionGte(a,b){

const x=versionParts(a);
const y=versionParts(b);

for(let i=0;i<3;i++){

const aa=x[i]||0;
const bb=y[i]||0;

if(aa>bb)return true;
if(aa<bb)return false;

}

return true;
}

function csv(value){

return String(value||"")
.split(",")
.map(v=>v.trim())
.filter(Boolean);

}

function safe(id){

return id.replace(/[^a-zA-Z0-9_]/g,"_");

}

return `

<label>${label}</label>
<input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}">
</div>
`;

}

function makeBoolean(id,label){

return `
<div class="boolean-setting">
<input id="${id}" type="checkbox">
<span>${label}</span>
</div>
`;

}

function getCard(id){

return document.querySelector(
'.component[data-id="'+id+'"]'
);

}

function isChecked(id){

const card=getCard(id);

if(!card)return false;

const checkbox=
card.querySelector(".component-check");

return checkbox.checked;

}

function getValue(id){

const element=
document.getElementById(id);

return element?element.value:"";

}

function getBool(id){

const element=
document.getElementById(id);

return !!element&&element.checked;

}

function renderComponents(){

const grid=
document.getElementById("componentGrid");

document.getElementById("formatVersion").value;

document.createElement("div");

element.className="component";

element.dataset.id=
component.id;

element.innerHTML=`
<div class="component-head">
<input type="checkbox" class="component-check">
<div class="component-name">${component.name}</div>
<div class="component-version">≥ ${component.min}</div>
</div>

`;

element.querySelector(".component-check");

"active",

);

const body=
element.querySelector(".component-body");

if(checkbox.checked){

renderBody(component,body);

}else{

body.innerHTML="";

}

updateDependencies();

});

}

updateDependencies();

}

html+=
makeBoolean(
"use_emit_vibrations",
"使用時に振動を発生させる"
);

break;

case"wearable":

html=`
<div class="field">
<label>装備スロット</label>
<select id="wearable_slot">
<option value="slot.armor.head">頭</option>
<option value="slot.armor.chest">胴</option>
<option value="slot.armor.legs">脚</option>
<option value="slot.armor.feet">足</option>
<option value="slot.armor.body">体</option>
<option value="slot.weapon.mainhand">メインハンド</option>
<option value="slot.weapon.offhand">オフハンド</option>
</select>
</div>
`;

html+=
makeField(
"wearable_protection",
"防御力",
"number",
"0"
);

html+=
makeBoolean(
"wearable_dispensable",
"ディスペンサーで装備可能"
);

html+=
makeBoolean(
"wearable_hides",
"プレイヤーの位置を隠す"
);

break;

}

body.innerHTML=html;

}

function updateDependencies(){

for(const parent in dependencyMap){

if(!isChecked(parent))continue;

for(const dependency of dependencyMap[parent]){

const dependencyCard=
getCard(dependency);

if(!dependencyCard)continue;

const checkbox=
dependencyCard.querySelector(".component-check");

if(!checkbox.checked){

checkbox.checked=true;

dependencyCard.classList.add("active");

const dependencyComponent=
components.find(
c=>c.id===dependency
);

if(dependencyComponent){

renderBody(
dependencyComponent,
dependencyCard.querySelector(".component-body")
);

}

}

}

}

document.querySelectorAll(".component").forEach(card=>{

const id=card.dataset.id;
const checkbox=
card.querySelector(".component-check");

let conflict=false;

for(const group of conflictGroups){

if(!group.includes(id))continue;

for(const other of group){

if(other!==id&&isChecked(other)){

conflict=true;
break;

}

}

if(conflict)break;

}

const required=
Object.keys(dependencyMap).some(
parent=>
isChecked(parent)&&
dependencyMap[parent].includes(id)
);

checkbox.disabled=
required||conflict;

card.classList.toggle(
"disabled",
required||conflict
);

});

}

function generate(){

const format=
document.getElementById("formatVersion").value;

const identifier=
document.getElementById("identifier").value.trim();

if(!identifier){

alert("アイテムIDを入力してください。");

return;

}

if(!identifier.includes(":")){

alert(
"アイテムIDには名前空間を付けてください。\n例：hiro:test_item"
);

return;

}

let stack=
parseInt(
document.getElementById("maxStack").value,
10
);

if(!Number.isFinite(stack)){
stack=64;
}

stack=
Math.max(
1,
Math.min(64,stack)
);

const output={
format_version:format,
"minecraft:item":{
description:{
identifier:identifier
},
components:{
"minecraft:icon":{
texture:
document.getElementById("iconTexture").value.trim()||
"test_item"
},
"minecraft:max_stack_size":stack
}
}
};

const item=
output["minecraft:item"];

const out=
item.components;

const category=
document.getElementById("category").value;

const group=
document.getElementById("group").value.trim();

if(category!=="none"||group){

item.description.menu_category={
category:
category==="none"?"items":category
};

if(group){

item.description.menu_category.group=
group;

}

}

for(const component of components){

if(!isChecked(component.id)){
continue;
}

switch(component.type){

case"boolean":

out[component.id]=true;

break;

case"damage":

out[component.id]=Math.max(
0,
Number(
getValue("damage_value")
)||0
);

break;

case"damage_absorption":

out[component.id]={
absorption_modifier:Math.max(
0,
Number(
getValue("damage_absorption_value")
)||0
)
};

break;

case"compostable":{

let chance=
Number(
getValue("compostable_chance")
);

if(!Number.isFinite(chance)){
chance=0.65;
}

out[component.id]={
compost_chance:
Math.max(
0,
Math.min(1,chance)
)
};

break;

}

case"cooldown":

out[component.id]={
category:
getValue("cooldown_category")||
"hiro_item",
duration:Math.max(
0,
Number(
getValue("cooldown_duration")
)||0
)
};

break;

case"digger":{

const speeds=[];

document.querySelectorAll(
".digger-block"
).forEach(input=>{

const row=
input.closest(".required");

const blocks=
csv(input.value);

const secondsInput=
row.querySelector(".digger-seconds");

const seconds=
Math.max(
0.01,
Number(secondsInput.value)||1
);

const speed=
Math.round(
(1/seconds)*100
)/100;

for(const block of blocks){

speeds.push({
block:block,
speed:speed
});

}

});

out[component.id]={
use_efficiency:
getBool("digger_efficiency"),
destroy_speeds:speeds
};

break;

}

case"display_name":{

const name=
getValue("display_name_value").trim();

if(name){

out[component.id]={
value:name
};

}

break;

}

case"durability":{

let max=
parseInt(
getValue("durability_max"),
10
);

let min=
parseInt(
getValue("durability_damage_min"),
10
);

let maxChance=
parseInt(
getValue("durability_damage_max"),
10
);

if(!Number.isFinite(max))max=100;
if(!Number.isFinite(min))min=100;
if(!Number.isFinite(maxChance))maxChance=100;

min=
Math.max(
0,
Math.min(100,min)
);

maxChance=
Math.max(
0,
Math.min(100,maxChance)
);

if(min>maxChance){

const temp=min;
min=maxChance;
maxChance=temp;

}

out[component.id]={
max_durability:
Math.max(0,max),
damage_chance:{
min:min,
max:maxChance
}
};

break;

}

case"enchantable":

out[component.id]={
slot:
getValue("enchantable_slot")||
"none",
value:Math.max(
0,
parseInt(
getValue("enchantable_value"),
10
)||0
)
};

break;

case"food":{

const food={
can_always_eat:
getBool("food_always"),
nutrition:Math.max(
0,
parseInt(
getValue("food_nutrition"),
10
)||0
),
saturation_modifier:Math.max(
0,
Number(
getValue("food_saturation")
)||0
)
};

const convert=
getValue("food_convert").trim();

if(convert){

food.using_converts_to=
convert;

}

out[component.id]=food;

break;

}

case"fuel":

out[component.id]={
duration:Math.max(
0.05,
Number(
getValue("fuel_duration")
)||0.05
)
};

break;

case"color":{

const color=
getValue("hover_text_color").trim();

if(color){

out[component.id]=color;

}

break;

}

case"interact_button":{

const text=
getValue("interact_text").trim();

if(text){

out[component.id]=text;

}

break;

}

case"kinetic_weapon":

out[component.id]={
damage:Math.max(
0,
Number(
getValue("kinetic_damage")
)||0
)
};

break;

case"projectile":{

const projectile={};

const entity=
getValue("projectile_entity").trim();

if(entity){

projectile.projectile_entity=
entity;

}

const critical=
Number(
getValue("projectile_critical")
);

if(
Number.isFinite(critical)&&
critical>0
){

projectile.minimum_critical_power=
critical;

}

out[component.id]=
projectile;

break;

}

case"rarity":

out[component.id]=
getValue("rarity_value")||
"common";

break;

case"record":{

const record={};

const sound=
getValue("record_sound").trim();

if(sound){

record.sound_event=
sound;

}

const duration=
Number(
getValue("record_duration")
);

if(
Number.isFinite(duration)&&
duration>0
){

record.duration=
duration;

}

const signal=
parseInt(
getValue("record_signal"),
10
);

if(Number.isFinite(signal)){

record.comparator_signal=
Math.max(
0,
signal
);

}

out[component.id]=
record;

break;

}

case"repairable":{

const items=
csv(
getValue("repair_items")
);

const amount=
Math.max(
0,
Number(
getValue("repair_amount")
)||0
);

out[component.id]={
repair_items:[
{
items:items,
repair_amount:amount
}
]
};

break;

}

case"shooter":{

const ammunition=[];

document.querySelectorAll(
"#shooterRows .required"
).forEach(row=>{

const item=
row.querySelector(
".shooter-item"
)?.value.trim();

if(!item)return;

ammunition.push({
item:item,
search_inventory:
row.querySelector(
".shooter-search"
)?.checked||false,
use_in_creative:
row.querySelector(
".shooter-creative"
)?.checked||false
});

});

const shooter={
ammunition:ammunition,
scale_power_by_draw_duration:
getBool("shooter_scale_power"),
charge_on_draw:
getBool("shooter_charge")
};

const maxDraw=
Number(
getValue("shooter_max_draw")
);

if(
Number.isFinite(maxDraw)&&
maxDraw>=0
){

shooter.max_draw_duration=
maxDraw;

}

out[component.id]=
shooter;

break;

}

case"storage_item":{

const slots=
Math.max(
1,
parseInt(
getValue("storage_max_slots"),
10
)||64
);

const storage={
max_slots:slots,
allow_nested_storage_items:
getBool("storage_nested")
};

const allowed=
csv(
getValue("storage_allowed")
);

const banned=
csv(
getValue("storage_banned")
);

if(allowed.length){

storage.allowed_items=
allowed;

}

if(banned.length){

storage.banned_items=
banned;

}

out[component.id]=
storage;

break;

}

case"number":

out[component.id]=Math.max(
0,
Number(
getValue(
"number_"+safe(component.id)
)
)||0
);

break;

case"tags":

out[component.id]={
tags:
csv(
getValue("item_tags")
)
};

break;

case"throwable":

out[component.id]={
do_swing_animation:
getBool("throwable_swing"),
launch_power_scale:Math.max(
0,
Number(
getValue("throwable_scale")
)||1
)
};

break;

case"use_modifiers":

out[component.id]={
use_duration:Math.max(
0,
Number(
getValue("use_duration")
)||0
),
movement_modifier:Math.max(
0,
Number(
getValue("movement_modifier")
)||0
),
emit_vibrations:
getBool("use_emit_vibrations")
};

break;

case"wearable":{

const slot=
getValue("wearable_slot");

out[component.id]={
slot:slot,
protection:Math.max(
0,
parseInt(
getValue("wearable_protection"),
10
)||0
)
};

if(
getBool("wearable_dispensable")
){

out[component.id].dispensable=
true;

}

if(
getBool("wearable_hides")
){

out[component.id].hides_player_location=
true;

}

if(
slot!=="slot.weapon.mainhand"&&
slot!=="slot.weapon.offhand"
){

out["minecraft:max_stack_size"]=1;

}

break;

}

}

}

document.getElementById("result").textContent=
JSON.stringify(
output,
null,
2
);

}

document.getElementById("formatVersion").addEventListener(
"change",
renderComponents
);

document.getElementById("generate").addEventListener(
"click",
generate
);

document.getElementById("copy").addEventListener(
"click",
async function(){

const text=
document.getElementById("result").textContent;

try{

await navigator.clipboard.writeText(text);

const button=
document.getElementById("copy");

const old=
button.textContent;

button.textContent=
"コピーしました";

setTimeout(
function(){
button.textContent=old;
},
1200
);

}catch{

alert(
"コピーできませんでした。"
);

}

});

renderComponents();

</script>

</body>
</html>
