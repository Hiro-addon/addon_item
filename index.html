<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
input:focus,select:focus{border-color:#666}
input::placeholder{color:#777;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.component-body input,.component-body select{margin-bottom:8px}
.component-body label{margin-top:10px}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.digger-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:center}
.digger-row input{margin:0}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>
</head>
<body>

<div class="container">

<h1>Hiro Addon Tools</h1>
<div class="subtitle">Minecraft Bedrock Addon Item JSON Generator</div>

<div class="section">
<h2>基本設定</h2>

<div class="grid">

<div class="field">
<label>フォーマットバージョン</label>
<select id="formatVersion">
<option value="1.20.0">1.20.0</option>
<option value="1.20.10">1.20.10</option>
<option value="1.20.30">1.20.30</option>
<option value="1.20.50">1.20.50</option>
<option value="1.21.0">1.21.0</option>
<option value="1.21.20">1.21.20</option>
<option value="1.21.40">1.21.40</option>
<option value="1.21.50">1.21.50</option>
<option value="1.21.90">1.21.90</option>
<option value="1.21.110">1.21.110</option>
<option value="1.21.120">1.21.120</option>
<option value="1.21.130">1.21.130</option>
<option value="1.26.0">1.26.0</option>
<option value="1.26.10">1.26.10</option>
<option value="1.26.30" selected>1.26.30</option>
</select>
</div>

<div class="field">
<label>アイテムID</label>
<input id="identifier" type="text" placeholder="hiro:test_item">
</div>

<div class="field">
<label>クリエイティブカテゴリ</label>
<select id="category">
<option value="none">なし</option>
<option value="items">アイテム</option>
<option value="equipment">装備</option>
<option value="nature">自然</option>
<option value="construction">建築</option>
</select>
</div>

<div class="field">
<label>クリエイティブグループ</label>
<input id="group" type="text" placeholder="空欄なら設定しない">
</div>

</div>
</div>

<div class="section">
<h2>基本コンポーネント</h2>

<div class="required">
<div class="required-title">minecraft:icon</div>
<div class="required-name">テクスチャ名</div>
<input id="iconTexture" type="text" placeholder="test_item">
<div class="help">resource_pack/textures/item_texture.json の texture_data に登録した名前</div>
</div>

<div class="required">
<div class="required-title">minecraft:max_stack_size</div>
<div class="required-name">最大スタック数</div>
<input id="maxStack" type="number" min="1" max="64" value="64">
</div>

</div>

<div class="section">
<h2>使うコンポーネント</h2>
<div id="componentGrid" class="component-grid"></div>
</div>

<button class="generate" id="generate">JSONを生成</button>

<div class="result">
<div class="result-box">
<div class="result-title">
<span>生成結果</span>
<button class="copy-btn" id="copy">コピー</button>
</div>
<pre id="result">{}</pre>
</div>
</div>

</div>

function versionNumber(v){
return v.split(".").map(Number);
}

function versionAtLeast(current,min){
const a=versionNumber(current);
const b=versionNumber(min);
for(let i=0;i<3;i++){
if((a[i]||0)>(b[i]||0))return true;
if((a[i]||0)<(b[i]||0))return false;
}
return true;
}

function addInput(parent,label,value,type="text",placeholder=""){
const wrap=document.createElement("div");
wrap.className="field";

const l=document.createElement("label");
l.textContent=label;
wrap.appendChild(l);

const input=document.createElement("input");
input.type=type;
input.value=value??"";
input.placeholder=placeholder;
wrap.appendChild(input);

parent.appendChild(wrap);
return input;
}

function addSelect(parent,label,options,value){
const wrap=document.createElement("div");
wrap.className="field";

const l=document.createElement("label");
l.textContent=label;
wrap.appendChild(l);

const select=document.createElement("select");

options.forEach(option=>{
const o=document.createElement("option");
o.value=option[0];
o.textContent=option[1];
select.appendChild(o);
});

select.value=value;
wrap.appendChild(select);
parent.appendChild(wrap);

return select;
}

function addCheckbox(parent,label,checked=true){
const wrap=document.createElement("div");
wrap.className="boolean-setting";

const input=document.createElement("input");
input.type="checkbox";
input.checked=checked;

const span=document.createElement("span");
span.textContent=label;

wrap.appendChild(input);
wrap.appendChild(span);
parent.appendChild(wrap);

return input;
}

function createDiggerRow(container,blockValue="",secondsValue=1){

const row=document.createElement("div");
row.className="digger-row";

const blockWrap=document.createElement("div");

const blockLabel=document.createElement("div");
blockLabel.className="digger-label";
blockLabel.textContent="対象ブロックID";

const block=document.createElement("input");
block.type="text";
block.placeholder="minecraft:stone";
block.value=blockValue;
block.dataset.diggerField="block";

blockWrap.appendChild(blockLabel);
blockWrap.appendChild(block);

const timeWrap=document.createElement("div");

const timeLabel=document.createElement("div");
timeLabel.className="digger-label";
timeLabel.textContent="破壊時間（秒）";

const seconds=document.createElement("input");
seconds.type="number";
seconds.min="0.01";
seconds.step="0.01";
seconds.value=secondsValue;
seconds.dataset.diggerField="seconds";

timeWrap.appendChild(timeLabel);
timeWrap.appendChild(seconds);

const remove=document.createElement("button");
remove.type="button";
remove.className="remove-row";
remove.textContent="×";

remove.onclick=()=>{
row.remove();
};

row.appendChild(blockWrap);
row.appendChild(timeWrap);
row.appendChild(remove);

container.appendChild(row);
}

function createFields(c,parent){

if(c.type==="boolean"){
const input=addCheckbox(parent,"有効にする",true);
input.dataset.field="value";
}

if(c.type==="empty"){
const input=addCheckbox(parent,"有効にする",true);
input.dataset.field="value";
}

if(c.type==="block"){
const input=addInput(parent,"ブロックID",c.default,"text","minecraft:stone");
input.dataset.field="value";
}

if(c.type==="number"){
const input=addInput(parent,"値",c.default,"number");
input.dataset.field="value";
input.step="any";
}

if(c.type==="text"){
const input=addInput(parent,"値",c.default,"text");
input.dataset.field="value";
}

if(c.type==="color"){
const input=addInput(parent,"デフォルト色",c.default.default_color,"text","#FFFFFF");
input.dataset.field="default_color";
}

input.dataset.field="value";
}

parent,
"アニメーション",
[

["eat","食べる"],
["drink","飲む"],
["bow","弓"],
["block","ブロック"],
["brush","ブラシ"],
["spear","槍"]

c.default

input.dataset.field="value";
}

category.dataset.field="category";

const duration=addInput(parent,"時間（秒）",c.default.duration,"number");
duration.step="any";
duration.dataset.field="duration";

value.dataset.field="value";

}

nutrition.dataset.field="nutrition";

saturation.dataset.field="saturation_modifier";

createDiggerRow(rows,"",1);

const entity=addInput(
parent,
"投射物エンティティ",

parent,

);
power.dataset.field="minimum_critical_power";
power.step="any";

const rarity=addSelect(
parent,
"レアリティ",
[
["common","Common"],
["uncommon","Uncommon"],

["epic","Epic"]
],
c.default
);

rarity.dataset.field="value";

if(c.type==="record"){

const signal=addInput(
parent,

c.default.comparator_signal,
"number"

signal.dataset.field="comparator_signal";

const duration=addInput(
parent,
"再生時間（秒）",
c.default.duration,
"number"

duration.dataset.field="duration";
duration.step="any";

const sound=addInput(
parent,
"サウンドイベント",
c.default.sound_event,
"text",
"13"
);
sound.dataset.field="sound_event";

const slots=addInput(
parent,
"最大スロット数",
c.default.max_slots,
"number"

slots.dataset.field="max_slots";
slots.min="1";

if(c.type==="tags"){

const input=addInput(
parent,
"タグ（カンマ区切り）",
c.default.join(","),
"text",
"minecraft:is_food,minecraft:custom"

input.dataset.field="value";
}

if(c.type==="throwable"){

const swing=addCheckbox(

"振りアニメーション",
c.default.do_swing_animation
);
swing.dataset.field="do_swing_animation";

const launch=addInput(
parent,
"発射倍率",
c.default.launch_power_scale,
"number"
);
launch.dataset.field="launch_power_scale";
launch.step="any";

const maxDraw=addInput(

function renderComponents(){

const version=document.getElementById("formatVersion").value;
const grid=document.getElementById("componentGrid");

grid.innerHTML="";

components
.filter(c=>versionAtLeast(version,c.min))
.forEach(c=>{

const box=document.createElement("div");
box.className="component";
box.dataset.componentId=c.id;

const head=document.createElement("div");
head.className="component-head";

const check=document.createElement("input");
check.type="checkbox";

const name=document.createElement("div");
name.className="component-name";
name.textContent=c.name;

const versionText=document.createElement("div");
versionText.className="component-version";
versionText.textContent=c.min+"+";

head.appendChild(check);
head.appendChild(name);
head.appendChild(versionText);

const body=document.createElement("div");
body.className="component-body";

const help=document.createElement("div");
help.className="help";
help.textContent=c.help;
body.appendChild(help);

createFields(c,body);

box.appendChild(head);
box.appendChild(body);

check.addEventListener("change",()=>{
box.classList.toggle("active",check.checked);
});

grid.appendChild(box);

});

}

function collectComponent(c,box){

const fields=box.querySelectorAll("[data-field]");

if(c.type==="boolean"){
return fields[0].checked;
}

if(c.type==="empty"){
return fields[0].checked;
}

if(c.type==="block"){
return{
block:fields[0].value
};
}

if(c.type==="number"){
return Number(fields[0].value);
}

if(c.type==="text"){
return fields[0].value;
}

if(c.type==="color"){
return{
default_color:fields[0].value
};
}

if(c.type==="entity"){
return{
entity_id:fields[0].value
};
}

if(c.type==="animation"){
return fields[0].value;
}

if(c.type==="cooldown"){
return{
category:fields[0].value,
duration:Number(fields[1].value)
};
}

if(c.type==="durability"){
return{
max_durability:Number(fields[0].value)
};
}

if(c.type==="enchantable"){
return{
slot:fields[0].value,
value:Number(fields[1].value)
};
}

if(c.type==="food"){
return{
nutrition:Number(fields[0].value),
saturation_modifier:Number(fields[1].value),
can_always_eat:fields[2].checked
};
}

if(c.type==="digger"){

const rows=box.querySelectorAll(".digger-row");
const destroy_speeds=[];

rows.forEach(row=>{

const block=row.querySelector('[data-digger-field="block"]').value.trim();
const seconds=Number(
row.querySelector('[data-digger-field="seconds"]').value
);

if(!block||!Number.isFinite(seconds)||seconds<=0){
return;
}

/*
破壊時間からマイクラの破壊速度へ変換

speed = 1 / 秒数

小数第2位までに丸める
*/

const speed=Math.round((1/seconds)*100)/100;

destroy_speeds.push({
block:block,
speed:speed
});

});

return{
destroy_speeds:destroy_speeds,
use_efficiency:box.querySelector('[data-field="use_efficiency"]').checked
};

}

if(c.type==="projectile"){
return{
projectile_entity:fields[0].value,
minimum_critical_power:Number(fields[1].value)
};
}

if(c.type==="rarity"){
return fields[0].value;
}

if(c.type==="record"){
return{
comparator_signal:Number(fields[0].value),
duration:Number(fields[1].value),
sound_event:fields[2].value
};
}

if(c.type==="storage"){
return{
max_slots:Number(fields[0].value)
};
}

if(c.type==="tags"){
return fields[0].value
.split(",")
.map(v=>v.trim())
.filter(Boolean);
}

if(c.type==="throwable"){
return{
do_swing_animation:fields[0].checked,
launch_power_scale:Number(fields[1].value),
max_draw_duration:Number(fields[2].value),
max_launch_power:Number(fields[3].value),
min_draw_duration:Number(fields[4].value),
scale_power_by_draw_duration:fields[5].checked
};
}

if(c.type==="use_modifiers"){
return{
use_duration:Number(fields[0].value),
movement_modifier:Number(fields[1].value),
emit_vibrations:fields[2].checked
};
}

if(c.type==="wearable"){
return{
slot:fields[0].value,
protection:Number(fields[1].value)
};
}

if(c.type==="repairable"){

const items=fields[0].value
.split(",")
.map(v=>v.trim())
.filter(Boolean);

return{
repair_items:items
};
}

if(c.type==="shooter"){

const ammunition=fields[0].value
.split(",")
.map(v=>v.trim())
.filter(Boolean);

return{
ammunition:ammunition,
charge_on_draw:fields[1].checked,
max_draw_duration:Number(fields[2].value),
scale_power_by_draw_duration:fields[3].checked
};
}

if(c.type==="json"){

try{
return JSON.parse(fields[0].value);
}catch{
return{};
}

}

return{};

}

function generate(){

const identifier=document.getElementById("identifier").value.trim()||"hiro:test_item";

const format_version=document.getElementById("formatVersion").value;

const icon=document.getElementById("iconTexture").value.trim()||"test_item";

let maxStack=Number(document.getElementById("maxStack").value);

if(!Number.isFinite(maxStack))maxStack=64;

maxStack=Math.max(1,Math.min(64,Math.floor(maxStack)));

const category=document.getElementById("category").value;

const group=document.getElementById("group").value.trim();

const componentsOutput={
"minecraft:icon":{
"texture":icon
},
"minecraft:max_stack_size":maxStack
};

if(category!=="none"){
componentsOutput["minecraft:creative_category"]={
"category":category
};
}

if(group){
componentsOutput["minecraft:creative_group"]=group;
}

document
.querySelectorAll(".component.active")
.forEach(box=>{

const c=components.find(
component=>component.id===box.dataset.componentId
);

if(!c)return;

componentsOutput[c.id]=collectComponent(c,box);

});

const output={
format_version:format_version,
"minecraft:item":{
description:{
identifier:identifier
},
components:componentsOutput
}
};

document.getElementById("result").textContent=
JSON.stringify(output,null,2);

}

document
.getElementById("formatVersion")
.addEventListener("change",renderComponents);

document
.getElementById("generate")
.addEventListener("click",generate);

document
.getElementById("copy")
.addEventListener("click",async()=>{

const text=document.getElementById("result").textContent;

try{

await navigator.clipboard.writeText(text);

const button=document.getElementById("copy");
const old=button.textContent;

button.textContent="コピーしました";

setTimeout(()=>{
button.textContent=old;
},1200);

}catch{}

});

renderComponents();
generate();

</script>
