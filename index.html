<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component.disabled{opacity:.45}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-head>input:disabled{cursor:not-allowed}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:end}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.digger-row input{margin:0}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>
</head>

function ver(v){
return v.split(".").map(Number);
}

function gte(a,b){

const x=ver(a);
const y=ver(b);

for(let i=0;i<3;i++){

const aa=x[i]||0;
const bb=y[i]||0;

if(aa>bb)return true;
if(aa<bb)return false;

}

return true;
}

function csv(value){

return String(value||"")
.split(",")
.map(v=>v.trim())
.filter(Boolean);

}

function safe(id){

return id.replace(/[^a-zA-Z0-9_]/g,"_");

}

function field(id,label,type="text",value="",placeholder=""){

return `
<div class="field">
<label>${label}</label>
<input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}">
</div>
`;

}

function bool(id,label){

return `
<div class="boolean-setting">
<input id="${id}" type="checkbox">
<span>${label}</span>
</div>
`;

}

function card(id){

return [...document.querySelectorAll(".component")]
.find(x=>x.dataset.id===id);

}

function checked(id){

const c=card(id);

return !!c&&c.querySelector(".component-check").checked;

}

function value(id){

const e=document.getElementById(id);

return e?e.value:"";

}

function boolValue(id){

const e=document.getElementById(id);

return !!e&&e.checked;

}

<div class="component-body"></div>
`;

"active",
checkbox.checked
);

);

c,
body
);

}else{

body.innerHTML="";

}

updateDependencies();

});

updateDependencies();

}

function updateDependencies(){

const requiredBy={};

for(const parent in dependencyMap){

if(!checked(parent))continue;

for(const dependency of dependencyMap[parent]){

if(!requiredBy[dependency]){
requiredBy[dependency]=new Set();
}

requiredBy[dependency].add(parent);

}

}

for(const dependency in requiredBy){

const target=card(dependency);

if(!target)continue;

const checkbox=
target.querySelector(".component-check");

if(!checkbox.checked){

checkbox.checked=true;

target.classList.add("active");

const component=
components.find(
x=>x.id===dependency
);

if(component){

renderBody(
component,
target.querySelector(".component-body")
);

}

}

}

document.querySelectorAll(".component").forEach(element=>{

const id=element.dataset.id;

const checkbox=
element.querySelector(".component-check");

let required=false;
let conflict=false;
let unavailableDependency=false;

if(requiredBy[id]){
required=true;
}

if(dependencyMap[id]){

for(const dependency of dependencyMap[id]){

const dependencyCard=
card(dependency);

if(!dependencyCard){

unavailableDependency=true;

break;

}

}

}

for(const group of conflictGroups){

if(!group.includes(id))continue;

for(const other of group){

if(other===id)continue;

if(checked(other)){

conflict=true;

break;

}

}

if(conflict)break;

}

const disabled=
required||
conflict||
unavailableDependency;

checkbox.disabled=disabled;

element.classList.toggle(
"disabled",
disabled
);

element.dataset.required=
required?"true":"false";

element.dataset.conflict=
conflict?"true":"false";

});

}

function generate(){

const format=
document.getElementById("formatVersion").value;

const identifier=
document.getElementById("identifier").value.trim();

if(!identifier){

alert("アイテムIDを入力してください。");

return;

}

if(!identifier.includes(":")){

alert(
"アイテムIDには名前空間を付けてください。\n例：hiro:test_item"
);

return;

}

let stack=
parseInt(
document.getElementById("maxStack").value,
10
);

if(!Number.isFinite(stack)){
stack=64;
}

stack=Math.max(
1,
Math.min(64,stack)
);

const output={
format_version:format,
"minecraft:item":{
description:{
identifier
},
components:{
"minecraft:icon":{
texture:
document.getElementById("iconTexture").value.trim()||
"test_item"
},
"minecraft:max_stack_size":stack
}
}
};

const item=
output["minecraft:item"];

const out=
item.components;

const description=
item.description;

const category=
document.getElementById("category").value;

const group=
document.getElementById("group").value.trim();

if(category!=="none"||group){

description.menu_category={
category:
category==="none"?"items":category
};

if(group){
description.menu_category.group=group;
}

}

components.forEach(c=>{

if(!checked(c.id))return;

switch(c.type){

case"boolean":

out[c.id]=true;

break;

case"number":

out[c.id]=
Number(
value("value_"+safe(c.id))
)||0;

break;

case"damage":

out[c.id]=Math.max(
0,
Number(
value("value_"+safe(c.id))
)||0
);

break;

case"damage_absorption":

out[c.id]=Math.max(
0,
Number(
value("value_"+safe(c.id))
)||0
);

break;

case"display_name":{

const v=
value("value_"+safe(c.id)).trim();

if(v){

out[c.id]={
value:v
};

}

break;

}

case"compostable":{

let chance=
Number(
value("value_"+safe(c.id))
);

if(!Number.isFinite(chance)){
chance=.65;
}

chance=Math.max(
0,
Math.min(1,chance)
);

out[c.id]={
compost_chance:chance
};

break;

}

case"cooldown":{

out[c.id]={
category:
value("cooldown_category")||
"hiro_item",

duration:Math.max(
0,
Number(
value("cooldown_duration")
)||0
)
};

break;

}

case"digger":{

const speeds=[];

document.querySelectorAll(
".digger-row"
).forEach(row=>{

const blocks=
csv(
row.querySelector(
".digger-block"
)?.value||""
);

const seconds=Math.max(
0.01,
Number(
row.querySelector(
".digger-seconds"
)?.value
)||1
);

const speed=
Math.round(
(1/seconds)*100
)/100;

blocks.forEach(block=>{

speeds.push({
block,
speed
});

});

});

out[c.id]={
use_efficiency:
boolValue("digger_efficiency"),
destroy_speeds:speeds
};

break;

}

case"durability":{

let max=
parseInt(
value("durability_max"),
10
);

let min=
parseInt(
value("durability_damage_min"),
10
);

let maxChance=
parseInt(
value("durability_damage_max"),
10
);

if(!Number.isFinite(max))max=100;
if(!Number.isFinite(min))min=100;
if(!Number.isFinite(maxChance))maxChance=100;

min=Math.max(
0,
Math.min(100,min)
);

maxChance=Math.max(
0,
Math.min(100,maxChance)
);

if(min>maxChance){

const temp=min;

min=maxChance;
maxChance=temp;

}

out[c.id]={
max_durability:Math.max(0,max),
damage_chance:{
min,
max:maxChance
}
};

break;

}

case"durability_sensor":{

const thresholds=[];

document.querySelectorAll(
"#sensorRows .required"
).forEach(row=>{

const inputs=
row.querySelectorAll("input");

const durability=
parseInt(
inputs[0]?.value,
10
)||0;

const particle=
inputs[1]?.value.trim();

const sound=
inputs[2]?.value.trim();

const threshold={
durability:Math.max(
0,
durability
)
};

if(particle){
threshold.particle_type=particle;
}

if(sound){
threshold.sound_event=sound;
}

thresholds.push(threshold);

});

out[c.id]={
durability_thresholds:
thresholds
};

break;

}

case"dyeable":

out[c.id]={

value("dyeable_color")||
"white"

value("enchantable_slot")||

0,
parseInt(
value("enchantable_value"),
10

};

value(
"entity_placer_entity"

csv(
value("entity_placer_useon")

csv(

entity

value("interact_text").trim();

value("projectile_entity").trim();

case"storage_item":{

case"swing_duration":

out[c.id]=Math.max(

break;

case"storage_weight_limit":

out[c.id]=Math.max(
0,

value("value_"+safe(c.id))

case"storage_weight_modifier":

out[c.id]=Math.max(

value("swing_attack").trim();

case"tags":{

case"throwable":

out[c.id]={
