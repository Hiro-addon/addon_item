<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component.disabled{opacity:.45}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.component-body input,.component-body select,.component-body textarea{margin-bottom:8px}
.component-body label{margin-top:10px}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:end}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.digger-row input{margin:0}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>
</head>

function ver(v){
return v.split(".").map(Number);
}

function gte(a,b){
const x=ver(a);
const y=ver(b);

for(let i=0;i<3;i++){
const aa=x[i]||0;
const bb=y[i]||0;

if(aa>bb)return true;
if(aa<bb)return false;
}

return true;
}

function csv(value){
return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);
}

function esc(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function field(id,label,type="text",value="",placeholder=""){
return `
<div class="field">
<label>${esc(label)}</label>
<input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">
</div>
`;
}

function bool(id,label){
return `
<div class="boolean-setting">
<input id="${id}" type="checkbox">
<span>${esc(label)}</span>
</div>
`;
}

function renderComponents(){

const grid=document.getElementById("componentGrid");
const format=document.getElementById("formatVersion").value;

grid.innerHTML="";

components.forEach(c=>{

if(!gte(format,c.min))return;

const card=document.createElement("div");

card.className="component";
card.dataset.id=c.id;

card.innerHTML=`
<div class="component-head">
<input type="checkbox" class="component-check">
<div class="component-name">${esc(c.name)}</div>
<div class="component-version">≥ ${c.min}</div>
</div>
<div class="component-body"></div>
`;

grid.appendChild(card);

const check=card.querySelector(".component-check");

check.addEventListener("change",()=>{

card.classList.toggle("active",check.checked);

const body=card.querySelector(".component-body");

if(check.checked){
renderBody(c,body);
}else{
body.innerHTML="";
}

updateDependencies();

});

});

}

function safe(id){
return id.replace(/[^a-zA-Z0-9_]/g,"_");
}

function checked(id){

const card=[...document.querySelectorAll(".component")].find(
x=>x.dataset.id===id
);

return !!card&&card.querySelector(".component-check").checked;

}

function value(id){

const e=document.getElementById(id);

return e?e.value:"";

}

function boolValue(id){

const e=document.getElementById(id);

return !!e&&e.checked;

}

function card(id){

return [...document.querySelectorAll(".component")].find(
x=>x.dataset.id===id
);

}

function disable(id,disabled){

const c=card(id);

if(!c)return;

const checkbox=c.querySelector(".component-check");

checkbox.disabled=disabled;

if(disabled&&checkbox.checked){

checkbox.checked=false;

c.classList.remove("active");

c.querySelector(".component-body").innerHTML="";

}

c.classList.toggle("disabled",disabled);

}

function updateDependencies(){

const food=checked("minecraft:food");
const foodModifiers=checked("minecraft:use_modifiers");

const sensor=checked("minecraft:durability_sensor");
const durability=checked("minecraft:durability");

if(sensor&&!durability){
disable("minecraft:durability_sensor",true);
}else{
disable("minecraft:durability_sensor",false);
}

if(food&&!foodModifiers){
disable("minecraft:food",true);
}else{
disable("minecraft:food",false);
}

}

function generate(){

const format=document.getElementById("formatVersion").value;

const identifier=document.getElementById("identifier").value.trim();

if(!identifier){

alert("アイテムIDを入力してください。");

return;

}

if(!identifier.includes(":")){

alert("アイテムIDには名前空間を付けてください。\n例：hiro:test_item");

return;

}

let stack=parseInt(
document.getElementById("maxStack").value,
10
);

if(!Number.isFinite(stack)){
stack=64;
}

stack=Math.max(
1,
Math.min(64,stack)
);

const output={
format_version:format,
"minecraft:item":{
description:{
identifier
},
components:{
"minecraft:icon":{
texture:
document.getElementById("iconTexture").value.trim()||"test_item"
},
"minecraft:max_stack_size":stack
}
}
};

const out=
output["minecraft:item"].components;

const description=
output["minecraft:item"].description;

const category=
document.getElementById("category").value;

const group=
document.getElementById("group").value.trim();

if(category!=="none"||group){

description.menu_category={
category
};

if(group){
description.menu_category.group=group;
}

}

components.forEach(c=>{

if(!checked(c.id))return;

switch(c.type){

case"boolean":

out[c.id]=true;

break;

case"damage":

out[c.id]=Math.max(
1,
parseInt(value("value_"+safe(c.id)),10)||1
);

break;

case"damage_absorption":

out[c.id]=Math.max(
0,
Number(value("value_"+safe(c.id)))||0
);

break;

case"number":

out[c.id]=Number(
value("value_"+safe(c.id))
)||0;

break;

case"display_name":{

const v=value("value_"+safe(c.id)).trim();

if(v){
out[c.id]={
value:v
};
}

break;
}

case"compostable":{

let v=Number(
value("value_"+safe(c.id))
);

if(!Number.isFinite(v))v=.65;

v=Math.max(0,Math.min(1,v));

out[c.id]={
compost_chance:v
};

break;
}

case"cooldown":{

const obj={
category:value("cooldown_category")||"hiro_item",
duration:Math.max(
0,
Number(value("cooldown_duration"))||0
)
};

if(gte(format,"1.21.130")){
obj.type=value("cooldown_type")||"use";
}

out[c.id]=obj;

break;
}

case"digger":{

const speeds=[];

document.querySelectorAll(".digger-row").forEach(row=>{

const ids=csv(
row.querySelector(".digger-block")?.value||""
);

const seconds=Math.max(
0.01,
Number(
row.querySelector(".digger-seconds")?.value
)||1
);

let speed=Math.round(
(1/seconds)*100
)/100;

speed=Math.max(
1,
Math.floor(speed)
);

ids.forEach(block=>{
speeds.push({
block,
speed
});
});

});

out[c.id]={
use_efficiency:
boolValue("digger_efficiency"),
destroy_speeds:speeds
};

break;
}

case"durability":{

let max=parseInt(
value("durability_max"),
10
)||1;

let min=parseInt(
value("durability_damage_min"),
10
);

let chanceMax=parseInt(
value("durability_damage_max"),
10
);

if(!Number.isFinite(min))min=100;
if(!Number.isFinite(chanceMax))chanceMax=100;

min=Math.max(0,Math.min(100,min));
chanceMax=Math.max(0,Math.min(100,chanceMax));

if(min>chanceMax){
const t=min;
min=chanceMax;
chanceMax=t;
}

out[c.id]={
max_durability:Math.max(1,max),
damage_chance:{
min,
max:chanceMax
}
};

break;
}

case"durability_sensor":{

const thresholds=[];

document.querySelectorAll("#sensorRows .required").forEach(row=>{

const inputs=row.querySelectorAll("input");

const durability=parseInt(
inputs[0]?.value,
10
)||0;

const particle=inputs[1]?.value.trim();
const sound=inputs[2]?.value.trim();

const obj={
durability:Math.max(0,durability)
};

if(particle){
obj.particle_type=particle;
}

if(sound){
obj.sound_event=sound;
}

thresholds.push(obj);

});

out[c.id]={
durability_thresholds:thresholds
};

break;
}

case"dyeable":

out[c.id]={
default_color:value("dyeable_color")||"white"
};

break;

case"enchantable":

out[c.id]={
slot:value("enchantable_slot")||"none",
value:Math.max(
0,
parseInt(value("enchantable_value"),10)||0
)
};

break;

case"entity_placer":{

const obj={
entity:value("entity_placer_entity").trim()
};

const useOn=csv(
value("entity_placer_useon")
);

const dispense=csv(
value("entity_placer_dispense")
);

if(useOn.length){
obj.use_on=useOn;
}

if(dispense.length){
obj.dispense_on=dispense;
}

out[c.id]=obj;

break;
}

case"food":{

const food={
can_always_eat:
boolValue("food_always"),
nutrition:Math.max(
0,
parseInt(value("food_nutrition"),10)||0
),
saturation_modifier:Math.max(
0,
Number(value("food_saturation"))||0
)
};

const convert=value("food_convert").trim();

if(convert){
food.using_converts_to=convert;
}

out[c.id]=food;

break;
}

case"fuel":

out[c.id]={
duration:Math.max(
0.05,
Number(value("fuel_duration"))||0.05
)
};

break;

case"color":{

const v=value("hover_text_color").trim();

if(v){
out[c.id]=v;
}

break;
}

case"interact_button":{

if(value("interact_mode")==="true"){
out[c.id]=true;
}else{
out[c.id]=value("interact_text")||"";
}

break;
}

case"projectile":

out[c.id]={
projectile_entity:
value("projectile_entity").trim()
};

break;

case"rarity":

out[c.id]=
value("rarity_value")||"common";

break;

case"record":{

const obj={};

const sound=value("record_sound").trim();

if(sound){
obj.sound_event=sound;
}

const duration=Number(
value("record_duration")
);

if(Number.isFinite(duration)&&duration>0){
obj.duration=duration;
}

const signal=parseInt(
value("record_signal"),
10
);

if(Number.isFinite(signal)){
obj.comparator_signal=Math.max(0,signal);
}

out[c.id]=obj;

break;
}

case"repairable":{

const items=csv(
value("repair_items")
);

const amount=Math.max(
0,
Number(value("repair_amount"))||0
);

out[c.id]={
repair_items:[
{
items,
repair_amount:amount
}
]
};

break;
}

case"storage_item":{

const obj={
max_slots:Math.max(
1,
parseInt(value("storage_max_slots"),10)||1
),
allow_nested_storage_items:
boolValue("storage_nested")
};

const allowed=csv(
value("storage_allowed")
);

const banned=csv(
value("storage_banned")
);

if(allowed.length){
obj.allowed_items=allowed;
}

if(banned.length){
obj.banned_items=banned;
}

out[c.id]=obj;

break;
}

case"swing_duration":

out[c.id]=Math.max(
0,
Number(value("value_"+safe(c.id)))||0
);

break;

case"storage_weight_limit":

out[c.id]=Math.max(
0,
Number(value("value_"+safe(c.id)))||0
);

break;

case"storage_weight_modifier":

out[c.id]=Math.max(
0,
Number(value("value_"+safe(c.id)))||0
);

break;

case"swing_sounds":{

const obj={};

const attack=value("swing_attack").trim();
const use=value("swing_use").trim();

if(attack){
obj.attack=attack;
}

if(use){
obj.use=use;
}

out[c.id]=obj;

break;
}

case"tags":{

const tags=csv(
value("item_tags")
);

out[c.id]={
tags
};

break;
}

case"throwable":

out[c.id]={
do_swing_animation:
boolValue("throwable_swing"),
launch_power_scale:
Math.max(
0,
Number(value("throwable_scale"))||1
)
};

break;

case"use_animation":

out[c.id]=
value("use_animation_value")||"none";

break;

case"use_modifiers":

out[c.id]={
use_duration:Math.max(
0,
Number(value("use_duration"))||0
),
movement_modifier:Math.max(
0,
Number(value("movement_modifier"))||0
)
};

break;

case"wearable":{

const slot=value("wearable_slot");

const obj={
slot,
protection:Math.max(
0,
parseInt(value("wearable_protection"),10)||0
)
};

if(boolValue("wearable_dispensable")){
obj.dispensable=true;
}

if(boolValue("wearable_hides")){
obj.hides_player_location=true;
}

out[c.id]=obj;

if(
slot!=="slot.weapon.mainhand"&&
slot!=="slot.weapon.offhand"
){

out["minecraft:max_stack_size"]=1;

}

break;
}

case"block_placer":{

const block=
value("block_placer_block").trim();

const obj={
block
};

if(
gte(format,"1.26.10")&&
boolValue("block_placer_aligned")
){
obj.aligned_placement=true;
}

if(boolValue("block_placer_replace")){
obj.replace_block_item=true;
}

const useOn=csv(
value("block_placer_useon")
);

if(useOn.length){
obj.use_on=useOn;
}

out[c.id]=obj;

break;
}

}

});

document.getElementById("result").textContent=
JSON.stringify(output,null,2);

}

document.getElementById("formatVersion").addEventListener(
"change",
renderComponents
);

document.getElementById("generate").addEventListener(
"click",
generate
);

document.getElementById("copy").addEventListener(
"click",
async()=>{

const text=
document.getElementById("result").textContent;

try{

await navigator.clipboard.writeText(text);

const button=
document.getElementById("copy");

const old=
button.textContent;

button.textContent="コピーしました";

setTimeout(()=>{
button.textContent=old;
},1200);

}catch{

alert("コピーできませんでした。");

}

}
);

renderComponents();

</script>
