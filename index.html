<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-head>input:disabled{opacity:.35}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.component-body input,.component-body select,.component-body textarea{margin-bottom:8px}
.component-body label{margin-top:10px}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:end}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.digger-row input{margin:0}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
.notice{font-size:11px;color:#888;background:#181818;border:1px solid #292929;border-radius:8px;padding:9px;margin-top:8px;line-height:1.5}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>
</head>

const formatVersion=document.getElementById("formatVersion");
const componentGrid=document.getElementById("componentGrid");

function versionNumber(v){
    return v.split(".").map(Number);
}

function versionAtLeast(current,min){
    const a=versionNumber(current);
    const b=versionNumber(min);
    for(let i=0;i<3;i++){
        if((a[i]||0)>(b[i]||0)) return true;
        if((a[i]||0)<(b[i]||0)) return false;
    }
    return true;
}

function addInput(parent,label,text,id,placeholder="",type="text"){
    const wrap=document.createElement("div");
    wrap.className="field";

    const l=document.createElement("label");
    l.textContent=label;
    wrap.appendChild(l);

    const input=document.createElement("input");
    input.type=type;
    input.id=id;
    input.value=text??"";
    input.placeholder=placeholder;
    wrap.appendChild(input);

    parent.appendChild(wrap);
    return input;
}

function addSelect(parent,label,id,options){
    const wrap=document.createElement("div");
    wrap.className="field";

    const l=document.createElement("label");
    l.textContent=label;
    wrap.appendChild(l);

    const select=document.createElement("select");
    select.id=id;

    options.forEach(o=>{
        const option=document.createElement("option");
        option.value=o.value;
        option.textContent=o.label;
        select.appendChild(option);
    });

    wrap.appendChild(select);
    parent.appendChild(wrap);
    return select;
}

function addCheckbox(parent,label,id,checked=false){
    const box=document.createElement("div");
    box.className="boolean-setting";

    const input=document.createElement("input");
    input.type="checkbox";
    input.id=id;
    input.checked=checked;

    const span=document.createElement("span");
    span.textContent=label;

    box.appendChild(input);
    box.appendChild(span);
    parent.appendChild(box);

    return input;
}

function createDiggerRow(parent){
    const row=document.createElement("div");
    row.className="digger-row";

    const idWrap=document.createElement("div");

    const idLabel=document.createElement("div");
    idLabel.className="digger-label";
    idLabel.textContent="ブロックID";
    idWrap.appendChild(idLabel);

    const idInput=document.createElement("input");
    idInput.className="digger-id";
    idInput.placeholder="minecraft:stone";
    idWrap.appendChild(idInput);

    const secWrap=document.createElement("div");

    const secLabel=document.createElement("div");
    secLabel.className="digger-label";
    secLabel.textContent="破壊秒数";
    secWrap.appendChild(secLabel);

    const secInput=document.createElement("input");
    secInput.className="digger-seconds";
    secInput.type="number";
    secInput.min="0.01";
    secInput.step="0.01";
    secInput.value="1";
    secWrap.appendChild(secInput);

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="remove-row";
    remove.textContent="×";

    remove.onclick=()=>{
        row.remove();
    };

    row.appendChild(idWrap);
    row.appendChild(secWrap);
    row.appendChild(remove);

    parent.appendChild(row);
}

function createFields(c,parent){

    if(c.type==="boolean"){
        addCheckbox(parent,"有効にする","field_"+c.id.replace(/[.:]/g,"_"));
        return;
    }

    if(c.type==="empty"){
        addCheckbox(parent,"有効にする","field_"+c.id.replace(/[.:]/g,"_"));
        return;
    }

    if(c.type==="number"){
        addInput(parent,"数値","0","value_"+c.id.replace(/[.:]/g,"_"),"数値","number");
        return;
    }

    if(c.type==="text"){
        addInput(parent,"文字列","","value_"+c.id.replace(/[.:]/g,"_"),"入力してください");
        return;
    }

    if(c.type==="block"){
        addInput(parent,"ブロックID","","block_"+c.id.replace(/[.:]/g,"_"),"minecraft:stone");
        addCheckbox(parent,"データ値を使用","block_data_"+c.id.replace(/[.:]/g,"_"));
        return;
    }

    if(c.type==="cooldown"){
        addInput(parent,"クールダウン時間（秒）","1","cooldown_time","1","number");

        addSelect(
            parent,
            "クールダウンタイプ",
            "cooldown_type",
            [
                {value:"none",label:"指定しない"},
                {value:"use",label:"使用"},
                {value:"attack",label:"攻撃"}
            ]
        );

        return;
    }

    if(c.type==="digger"){
        addCheckbox(parent,"効率強化を使用","digger_efficiency");

        const title=document.createElement("div");
        title.className="sub-title";
        title.textContent="破壊設定";
        parent.appendChild(title);

        const rows=document.createElement("div");
        rows.id="diggerRows";
        parent.appendChild(rows);

        createDiggerRow(rows);

        const add=document.createElement("button");
        add.type="button";
        add.className="add-row";
        add.textContent="＋ ブロックを追加";
        add.onclick=()=>createDiggerRow(rows);

        parent.appendChild(add);

        const help=document.createElement("div");
        help.className="help";
        help.textContent="破壊秒数から speed = 1 ÷ 秒数 に自動変換します。複数のブロックを登録できます。";
        parent.appendChild(help);

        return;
    }

    if(c.type==="durability"){
        addInput(parent,"最大耐久値","100","durability_max","100","number");
        addInput(parent,"現在の耐久値","100","durability_damage","100","number");
        return;
    }

    if(c.type==="durability_sensor"){
        addInput(parent,"耐久値割合","0.8","durability_sensor_threshold","0.8","number");
        addInput(parent,"イベント名","","durability_sensor_event","イベント名");
        return;
    }

    if(c.type==="color"){
        addInput(parent,"初期カラー","#FFFFFF","dyeable_color","#RRGGBB");
        return;
    }

    if(c.type==="enchantable"){
        addInput(parent,"エンチャントスロット","0","enchant_slot","例: 0","number");
        addInput(parent,"エンチャント可能レベル","10","enchant_value","例: 10","number");
        return;
    }

    if(c.type==="entity"){
        addInput(parent,"エンティティID","","entity_id","minecraft:armor_stand");
        return;
    }

    if(c.type==="food"){
        addCheckbox(parent,"空腹状態でも食べられる","food_always");
        addInput(parent,"栄養値","3","food_nutrition","3","number");
        addInput(parent,"満腹度倍率","0.6","food_saturation","0.6","number");
        addInput(parent,"食後に変換するアイテム","","food_convert","minecraft:bowl");

        const notice=document.createElement("div");
        notice.className="notice";
        notice.textContent="このコンポーネントを使用すると minecraft:use_modifiers も自動的に生成されます。";
        parent.appendChild(notice);

        return;
    }

    if(c.type==="fuel"){
        addInput(parent,"燃焼時間（秒）","1","fuel_duration","例: 120","number");
        return;
    }

    if(c.type==="projectile"){
        addInput(parent,"クリティカルに必要なチャージ時間","0","projectile_critical","0","number");
        addInput(parent,"飛ばすエンティティID","","projectile_entity","minecraft:arrow");
        return;
    }

    if(c.type==="rarity"){
        addSelect(
            parent,
            "レアリティ",
            "rarity_value",
            [
                {value:"common",label:"Common"},
                {value:"uncommon",label:"Uncommon"},
                {value:"rare",label:"Rare"},
                {value:"epic",label:"Epic"}
            ]
        );
        return;
    }

    if(c.type==="record"){
        addInput(parent,"サウンドイベント","","record_sound","music_disc.○○");
        addInput(parent,"再生時間（秒）","0","record_duration","秒","number");
        return;
    }

    if(c.type==="repairable"){
        const title=document.createElement("div");
        title.className="sub-title";
        title.textContent="修理アイテム";
        parent.appendChild(title);

        const input=addInput(parent,"修理に使うアイテム","","repair_items","","text");
        const help=document.createElement("div");
        help.className="help";
        help.textContent="複数指定する場合は , で区切ります。例: minecraft:iron_ingot,minecraft:diamond";
        parent.appendChild(help);

        addInput(parent,"修理量","1","repair_amount","耐久値","number");
        return;
    }

    if(c.type==="shooter"){
        addInput(parent,"弾薬アイテム","","shooter_ammunition","minecraft:arrow");

        addCheckbox(parent,"クリエイティブで使用","shooter_creative",true);
        addCheckbox(parent,"引き始めからチャージ","shooter_charge");

        addInput(parent,"最大引き時間（秒）","0","shooter_duration","0","number");

        addCheckbox(parent,"引き時間で威力を変える","shooter_scale");

        const notice=document.createElement("div");
        notice.className="notice";
        notice.textContent="射撃武器には minecraft:use_modifiers が必要です。生成時に自動追加します。";
        parent.appendChild(notice);

        return;
    }

    if(c.type==="storage"){
        addInput(parent,"最大収納重量","64","storage_weight","64","number");
        return;
    }

    if(c.type==="tags"){
        const input=addInput(parent,"タグ","","tags_value","minecraft:is_food,minecraft:...");
        const help=document.createElement("div");
        help.className="help";
        help.textContent="複数指定する場合は , で区切ります。";
        parent.appendChild(help);
        return;
    }

    if(c.type==="throwable"){
        addCheckbox(parent,"引き時間で威力を変える","throwable_scale");
        addInput(parent,"最小引き時間（秒）","0","throwable_min","0","number");
        addInput(parent,"最大引き時間（秒）","0","throwable_max","0","number");

        const notice=document.createElement("div");
        notice.className="notice";
        notice.textContent="投擲アイテムには minecraft:projectile が必要です。生成時に自動追加します。";
        parent.appendChild(notice);

        return;
    }

    if(c.type==="animation"){
        addSelect(
            parent,
            "アニメーション",
            "animation_value",
            [
                {value:"none",label:"なし"},
                {value:"eat",label:"食べる"},
                {value:"drink",label:"飲む"},
                {value:"bow",label:"弓を引く"},
                {value:"brush",label:"ブラシ"},
                {value:"camera",label:"カメラ"}
            ]
        );
        return;
    }

    if(c.type==="use_modifiers"){
        addCheckbox(parent,"振動を発生させる","use_emit",true);
        addInput(parent,"移動速度倍率","1","use_movement","1","number");
        addInput(parent,"使用時間（秒）","1.6","use_duration","1.6","number");

        addSelect(
            parent,
            "使用開始条件",
            "use_start_using",
            [
                {value:"always",label:"常に"},
                {value:"on_attack",label:"攻撃時"}
            ]
        );

        addInput(parent,"開始音","","use_start_sound","任意");
        return;
    }

    if(c.type==="wearable"){
        addSelect(
            parent,
            "装備スロット",
            "wearable_slot",
            [
                {value:"slot.armor.head",label:"頭"},
                {value:"slot.armor.chest",label:"胴"},
                {value:"slot.armor.legs",label:"脚"},
                {value:"slot.armor.feet",label:"足"},
                {value:"slot.armor.body",label:"ボディ"},
                {value:"slot.weapon.offhand",label:"オフハンド"}
            ]
        );

        addInput(parent,"装備グループ","","wearable_group","例: custom");

    }

        textarea.id="json_"+c.id.replace(/[.:]/g,"_");
        textarea.placeholder='{"key":"value"}';
        parent.appendChild(textarea);

        const help=document.createElement("div");
        help.className="help";
        help.textContent="このコンポーネントの設定をJSON形式で入力します。";
        parent.appendChild(help);

        return;
    }
}

function renderComponents(){
    const current=formatVersion.value;
    componentGrid.innerHTML="";

    components.forEach(c=>{
        if(!versionAtLeast(current,c.min)) return;

        const box=document.createElement("div");
        box.className="component";
        box.dataset.id=c.id;

        const head=document.createElement("div");
        head.className="component-head";

        const checkbox=document.createElement("input");
        checkbox.type="checkbox";
        checkbox.dataset.component=c.id;

        const name=document.createElement("div");
        name.className="component-name";
        name.textContent=c.name;

        const ver=document.createElement("div");
        ver.className="component-version";
        ver.textContent=c.min+"+";

        head.appendChild(checkbox);
        head.appendChild(name);
        head.appendChild(ver);

        const body=document.createElement("div");
        body.className="component-body";

        const description=document.createElement("div");
        description.className="help";
        description.textContent=c.description;
        body.appendChild(description);

        createFields(c,body);

        box.appendChild(head);
        box.appendChild(body);
        componentGrid.appendChild(box);

        checkbox.addEventListener("change",()=>{
            box.classList.toggle("active",checkbox.checked);
        });
    });
}

function getChecked(id){
    const el=document.querySelector('[data-component="'+id+'"]');
    return !!(el&&el.checked);
}

function forceDependency(id){
    const el=document.querySelector('[data-component="'+id+'"]');
    if(el){
        el.checked=true;
        el.closest(".component")?.classList.add("active");
    }
}

function splitValues(value){
    return value
        .split(",")
        .map(v=>v.trim())
        .filter(Boolean);
}

function numberValue(id,defaultValue=0){
    const el=document.getElementById(id);
    if(!el) return defaultValue;
    const n=Number(el.value);
    return Number.isFinite(n)?n:defaultValue;
}

function buildComponent(c){

    const id=c.id;

    if(c.type==="boolean"){
        return true;
    }

    if(c.type==="empty"){
        return {};
    }

    if(c.type==="number"){
        return numberValue("value_"+id.replace(/[.:]/g,"_"));
    }

    if(c.type==="text"){
        return {
            value:document.getElementById("value_"+id.replace(/[.:]/g,"_"))?.value||""
        };
    }

    if(c.type==="block"){
        const block=document.getElementById("block_"+id.replace(/[.:]/g,"_"))?.value.trim()||"";
        const data=document.getElementById("block_data_"+id.replace(/[.:]/g,"_"))?.checked;

        if(data){
            return {
                block,
                use_on:true
            };
        }

        return {
            block
        };
    }

    if(c.type==="cooldown"){
        const obj={
            category:"item",
            duration:numberValue("cooldown_time",1)
        };

        const type=document.getElementById("cooldown_type")?.value;
        if(type&&type!=="none") obj.type=type;

        return obj;
    }

    if(c.type==="digger"){
        const rows=[...document.querySelectorAll("#diggerRows .digger-row")];

        const destroy_speeds=rows.map(row=>{
            const ids=splitValues(row.querySelector(".digger-id")?.value||"");
            const seconds=Number(row.querySelector(".digger-seconds")?.value)||1;
            const speed=Math.round((1/seconds)*100)/100;

            return {
                block:ids.length===1?ids[0]:ids,
                speed
            };
        }).filter(x=>{
            if(Array.isArray(x.block)) return x.block.length;
            return x.block;
        });

        return {
            destroy_speeds,
            use_efficiency:document.getElementById("digger_efficiency")?.checked||false
        };
    }

    if(c.type==="durability"){
        return {
            max_durability:numberValue("durability_max",100),
            damage_chance:{
                min:100,
                max:100
            }
        };
    }

    if(c.type==="durability_sensor"){
        const threshold=numberValue("durability_sensor_threshold",0.8);
        const event=document.getElementById("durability_sensor_event")?.value.trim();

        const obj={
            durability_thresholds:[
                {
                    threshold,
                    on_equip: event||""
                }
            ]
        };

        return obj;
    }

    if(c.type==="color"){
        return {
            color:document.getElementById("dyeable_color")?.value||"#FFFFFF"
        };
    }

    if(c.type==="enchantable"){
        return {
            slot:numberValue("enchant_slot",0),
            value:numberValue("enchant_value",10)
        };
    }

    if(c.type==="entity"){
        return {
            entity:document.getElementById("entity_id")?.value.trim()||""
        };
    }

    if(c.type==="food"){
        const obj={
            can_always_eat:document.getElementById("food_always")?.checked||false,
            nutrition:numberValue("food_nutrition",3),
            saturation_modifier:numberValue("food_saturation",0.6)
        };

        const convert=document.getElementById("food_convert")?.value.trim();
        if(convert) obj.using_converts_to=convert;

        return obj;
    }

    if(c.type==="fuel"){
        return {
            duration:Math.max(0.05,numberValue("fuel_duration",1))
        };
    }

    if(c.type==="projectile"){
        const obj={
            minimum_critical_power:numberValue("projectile_critical",0)
        };

        const entity=document.getElementById("projectile_entity")?.value.trim();
        if(entity) obj.projectile_entity=entity;

        return obj;
    }

    if(c.type==="rarity"){
        return {
            value:document.getElementById("rarity_value")?.value||"common"
        };
    }

    if(c.type==="record"){
        const obj={};

        const sound=document.getElementById("record_sound")?.value.trim();
        if(sound) obj.sound_event=sound;

        obj.duration=numberValue("record_duration",0);

        return obj;
    }

    if(c.type==="repairable"){
        const items=splitValues(document.getElementById("repair_items")?.value||"");
        const amount=numberValue("repair_amount",1);

        return {
            repair_items:items.map(item=>({
                items:item,
                repair_amount:amount
            }))
        };
    }

    if(c.type==="shooter"){
        const item=document.getElementById("shooter_ammunition")?.value.trim();

        const ammunition=[];

        if(item){
            ammunition.push({
                item,
                search_inventory:document.getElementById("shooter_search")?.checked||false,
                use_in_creative:document.getElementById("shooter_creative")?.checked||false
            });
        }

        return {
            ammunition,
            charge_on_draw:document.getElementById("shooter_charge")?.checked||false,
            max_draw_duration:numberValue("shooter_duration",0),
            scale_power_by_draw_duration:document.getElementById("shooter_scale")?.checked||false
        };
    }

    if(c.type==="storage"){
        return {
            max_weight:numberValue("storage_weight",64)
        };
    }

    if(c.type==="tags"){
        return {
            tags:splitValues(document.getElementById("tags_value")?.value||"")
        };
    }

    if(c.type==="throwable"){
        return {
            do_swing:true,
            scale_power_by_draw_duration:document.getElementById("throwable_scale")?.checked||false,
            min_draw_duration:numberValue("throwable_min",0),
            max_draw_duration:numberValue("throwable_max",0)
        };
    }

    if(c.type==="animation"){
        const value=document.getElementById("animation_value")?.value||"none";
        return {
            value:value==="none"?"none":value
        };
    }

    if(c.type==="use_modifiers"){
        const obj={
            emit_vibrations:document.getElementById("use_emit")?.checked!==false,
            use_duration:numberValue("use_duration",1.6),
            movement_modifier:numberValue("use_movement",1)
        };

        const startUsing=document.getElementById("use_start_using")?.value;
        if(startUsing&&startUsing!=="always") obj.start_using=startUsing;

        const sound=document.getElementById("use_start_sound")?.value.trim();
        if(sound) obj.start_sound=sound;

        return obj;
    }

    if(c.type==="wearable"){
        return {
            protection:0,
            slot:document.getElementById("wearable_slot")?.value||"slot.armor.head",
            ...(document.getElementById("wearable_group")?.value.trim()
                ?{dispensable:true}
                :{})
        };
    }

    if(c.type==="json"){
        const value=document.getElementById("json_"+id.replace(/[.:]/g,"_"))?.value.trim()||"{}";

        try{
            return JSON.parse(value);
        }catch{
            throw new Error(c.name+" のJSON設定が正しくありません。");
        }
    }

    return {};
}

function generate(){

    const version=formatVersion.value;
    const identifier=document.getElementById("identifier").value.trim();

    if(!identifier){
        alert("アイテムIDを入力してください。");
        return;
    }

    const componentsOutput={
        "minecraft:icon":{
            texture:document.getElementById("iconTexture").value.trim()||"test_item"
        },
        "minecraft:max_stack_size":Math.min(
            64,
            Math.max(
                1,
                Number(document.getElementById("maxStack").value)||64
            )
        )
    };

    const selected=components.filter(c=>getChecked(c.id));

    if(selected.some(c=>c.id==="minecraft:food")){
        forceDependency("minecraft:use_modifiers");
    }

    if(selected.some(c=>c.id==="minecraft:throwable")){
        forceDependency("minecraft:projectile");
    }

    if(selected.some(c=>c.id==="minecraft:shooter")){
        forceDependency("minecraft:use_modifiers");
        forceDependency("minecraft:projectile");
    }

    const finalSelected=components.filter(c=>getChecked(c.id));

    try{
        finalSelected.forEach(c=>{
            componentsOutput[c.id]=buildComponent(c);
        });
    }catch(e){
        alert(e.message);
        return;
    }

    const description={
        identifier
    };

    const category=document.getElementById("category").value;
    const group=document.getElementById("group").value.trim();

    if(category!=="none"||group){
        description.menu_category={};

        if(category!=="none"){
            description.menu_category.category=category;
        }

        if(group){
            description.menu_category.group=group;
        }
    }

    const output={
        format_version:version,
        "minecraft:item":{
            description,
            components:componentsOutput
        }
    };

    document.getElementById("result").textContent=
        JSON.stringify(output,null,2);
}

document.getElementById("generate").addEventListener("click",generate);

document.getElementById("copy").addEventListener("click",async()=>{
    const text=document.getElementById("result").textContent;

    try{
        await navigator.clipboard.writeText(text);
        document.getElementById("copy").textContent="コピーしました";
        setTimeout(()=>{
            document.getElementById("copy").textContent="コピー";
        },1200);
    }catch{
        alert("コピーできませんでした。");
    }
});

formatVersion.addEventListener("change",renderComponents);

renderComponents();
</script>
