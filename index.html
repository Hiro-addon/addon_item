<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component.disabled{opacity:.45}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.component-body input,.component-body select,.component-body textarea{margin-bottom:8px}
.component-body label{margin-top:10px}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:end}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.digger-row input{margin:0}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>
</head>

function versionArray(v){
return v.split(".").map(Number);
}

function versionGTE(a,b){
const x=versionArray(a);
const y=versionArray(b);

for(let i=0;i<3;i++){
const aa=x[i]||0;
const bb=y[i]||0;

if(aa>bb)return true;
if(aa<bb)return false;
}

return true;
}

function csv(value){
return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);
}

function esc(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function renderComponents(){
const grid=document.getElementById("componentGrid");
const format=document.getElementById("formatVersion").value;

grid.innerHTML="";

components.forEach(component=>{
if(!versionGTE(format,component.min))return;

const card=document.createElement("div");
card.className="component";
card.dataset.component=component.id;

card.innerHTML=`
<div class="component-head">
<input type="checkbox" data-component="${component.id}">
<div class="component-name">${esc(component.name)}</div>
<div class="component-version">≥ ${component.min}</div>
</div>
<div class="component-body"></div>
`;

grid.appendChild(card);

const checkbox=card.querySelector("[data-component]");
const body=card.querySelector(".component-body");

checkbox.addEventListener("change",()=>{
card.classList.toggle("active",checkbox.checked);

if(checkbox.checked){
renderComponentBody(component,body);
}else{
body.innerHTML="";
}

updateDependencies();
});
});
}

function textField(id,label,type="text",value="",placeholder=""){
return `
<div class="field">
<label>${esc(label)}</label>
<input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">
</div>
`;
}

function booleanSetting(id,label,checked=false){
return `
<div class="boolean-setting">
<input id="${id}" type="checkbox" ${checked?"checked":""}>
<span>${esc(label)}</span>
</div>
`;
}

function renderComponentBody(component,body){
let html="";

switch(component.type){

case"boolean":
html=booleanSetting(component.id+"_value","有効にする");
break;

case"number":
html=textField(component.id+"_value","数値","number","1");
break;

case"damage":
html=textField(component.id+"_value","追加ダメージ","number","1");
break;

case"damage_absorption":
html=textField(component.id+"_value","吸収量","number","1");
break;

case"display_name":
html=textField(component.id+"_value","表示名","text","","例：ひろのアイテム");
break;

case"compostable":
html=textField(component.id+"_value","堆肥化確率","number","0.65");
html+=`<div class="help">0～1の範囲で入力してください。</div>`;
break;

case"cooldown":
html=textField(component.id+"_category","カテゴリ","text","hiro_item");
html+=textField(component.id+"_duration","時間（秒）","number","1");
if(versionGTE(document.getElementById("formatVersion").value,"1.21.130")){
html+=`
<div class="field">
<label>発動方法</label>
<select id="minecraft:cooldown_type">
<option value="use">使用</option>
<option value="attack">攻撃</option>
</select>
</div>
`;
}
break;

case"digger":
html=`
<div class="boolean-setting">
<input id="minecraft:digger_efficiency" type="checkbox">
<span>効率強化を使用する</span>
</div>

<div class="help">ブロックIDはカンマ区切りで複数指定できます。入力した秒数から採掘速度倍率を計算します。</div>
`;

</div>

`;

function isChecked(id){
const element=document.querySelector(`[data-component="${id}"]`);
return !!element&&element.checked;
}

function getValue(id){
const element=document.getElementById(id);
return element?element.value:"";
}

function isInputChecked(id){
const element=document.getElementById(id);
return !!element&&element.checked;
}

function setComponentDisabled(id,disabled){
const card=document.querySelector(`[data-component="${id}"]`)?.closest(".component");

if(!card)return;

const checkbox=card.querySelector("[data-component]");

if(disabled&&checkbox.checked){
checkbox.checked=false;
card.classList.remove("active");
card.querySelector(".component-body").innerHTML="";
}

checkbox.disabled=disabled;
card.classList.toggle("disabled",disabled);
}

function updateDependencies(){
const food=isChecked("minecraft:food");
const useModifiers=isChecked("minecraft:use_modifiers");
const durabilitySensor=isChecked("minecraft:durability_sensor");
const durability=isChecked("minecraft:durability");
const storage=isChecked("minecraft:storage_item");
const bundle=isChecked("minecraft:bundle_interaction");

setComponentDisabled(
"minecraft:durability_sensor",
!durability
);

if(food&&!useModifiers){
setComponentDisabled("minecraft:use_modifiers",false);
}

if(storage&&!bundle){
setComponentDisabled("minecraft:bundle_interaction",false);
}
}

function generate(){
const format=document.getElementById("formatVersion").value;
const identifier=document.getElementById("identifier").value.trim();

if(!identifier){
alert("アイテムIDを入力してください。");
return;
}

if(!/^[a-z0-9_]+:[a-z0-9_./-]+$/i.test(identifier)){
alert("アイテムIDを正しく入力してください。\n例：hiro:test_item");
return;
}

const icon=document.getElementById("iconTexture").value.trim()||"test_item";

let stack=Math.floor(Number(document.getElementById("maxStack").value));

if(!Number.isFinite(stack))stack=64;

stack=Math.max(1,Math.min(64,stack));

const item={
format_version:format,
"minecraft:item":{
description:{
identifier
},
components:{
"minecraft:icon":{
texture:icon
},
"minecraft:max_stack_size":stack
}
}
};

const description=item["minecraft:item"].description;
const componentsOut=item["minecraft:item"].components;

const category=document.getElementById("category").value;
const group=document.getElementById("group").value.trim();

if(category!=="none"||group){
description.menu_category={
category
};

if(group){
description.menu_category.group=group;
}
}

function add(id,value){
if(isChecked(id)){
componentsOut[id]=value;
}
}

add("minecraft:allow_off_hand",true);
add("minecraft:can_destroy_in_creative",true);
add("minecraft:fire_resistant",true);
add("minecraft:glint",true);
add("minecraft:hand_equipped",true);
add("minecraft:liquid_clipped",true);
add("minecraft:should_despawn",true);
add("minecraft:stacked_by_data",true);
add("minecraft:kinetic_weapon",true);
add("minecraft:piercing_weapon",true);

if(isChecked("minecraft:damage")){
componentsOut["minecraft:damage"]={
value:Math.max(0,Math.floor(Number(getValue("minecraft:damage_value"))||0))
};
}

if(isChecked("minecraft:damage_absorption")){
componentsOut["minecraft:damage_absorption"]=
Math.max(0,Number(getValue("minecraft:damage_absorption_value"))||0);
}

if(isChecked("minecraft:display_name")){
const value=getValue("minecraft:display_name_value").trim();

if(!value){
alert("表示名を入力してください。");
return;
}

componentsOut["minecraft:display_name"]={
value
};
}

if(isChecked("minecraft:compostable")){
let chance=Number(getValue("minecraft:compostable_value"));

if(!Number.isFinite(chance))chance=0.65;

chance=Math.max(0,Math.min(1,chance));

componentsOut["minecraft:compostable"]={
compost_chance:chance
};
}

if(isChecked("minecraft:cooldown")){
const duration=Math.max(0,Number(getValue("minecraft:cooldown_duration"))||0);
const categoryValue=getValue("minecraft:cooldown_category").trim();

if(!categoryValue){
alert("クールダウンカテゴリを入力してください。");
return;
}

const cooldown={
category:categoryValue,
duration
};

if(versionGTE(format,"1.21.130")){
cooldown.type=getValue("minecraft:cooldown_type")||"use";
}

componentsOut["minecraft:cooldown"]=cooldown;
}

if(isChecked("minecraft:digger")){
const rows=[...document.querySelectorAll(".digger-row")];
const destroySpeeds=[];

rows.forEach(row=>{
const blocks=csv(row.querySelector(".digger-block")?.value||"");
const seconds=Math.max(
0.01,
Number(row.querySelector(".digger-seconds")?.value)||1
);

let speed=Math.round((1/seconds)*100)/100;

speed=Math.max(1,speed);
speed=Math.floor(speed);

blocks.forEach(block=>{
destroySpeeds.push({
block,
speed
});
});
});

if(!destroySpeeds.length){
alert("diggerのブロックを1つ以上設定してください。");
return;
}

componentsOut["minecraft:digger"]={
use_efficiency:isInputChecked("minecraft:digger_efficiency"),
destroy_speeds:destroySpeeds
};
}

if(isChecked("minecraft:durability")){
let maxDurability=Math.floor(
Number(getValue("minecraft:durability_max"))||0
);

maxDurability=Math.max(0,maxDurability);

let min=Math.floor(
Number(getValue("minecraft:durability_damage_min"))
);

let max=Math.floor(
Number(getValue("minecraft:durability_damage_max"))
);

if(!Number.isFinite(min))min=100;
if(!Number.isFinite(max))max=100;

min=Math.max(0,Math.min(100,min));
max=Math.max(0,Math.min(100,max));

if(min>max){
const temp=min;
min=max;
max=temp;
}

componentsOut["minecraft:durability"]={
max_durability:maxDurability,
damage_chance:{
min,
max
}
};
}

if(isChecked("minecraft:durability_sensor")){
if(!isChecked("minecraft:durability")){
alert("耐久値センサーにはminecraft:durabilityが必要です。");
return;
}

const rows=[...document.querySelectorAll("#sensorRows .required")];
const thresholds=[];

rows.forEach(row=>{
const inputs=row.querySelectorAll("input");

const durability=Math.max(
0,
Math.floor(Number(inputs[0]?.value)||0)
);

const particle=inputs[1]?.value.trim();
const sound=inputs[2]?.value.trim();

const threshold={
durability
};

if(particle){
threshold.particle_type=particle;
}

if(sound){
threshold.sound_event=sound;
}

thresholds.push(threshold);
});

if(!thresholds.length){
alert("耐久値しきい値を1つ以上設定してください。");
return;
}

componentsOut["minecraft:durability_sensor"]={
durability_thresholds:thresholds
};
}

if(isChecked("minecraft:dyeable")){
componentsOut["minecraft:dyeable"]={
default_color:getValue("minecraft:dyeable_default")||"white"
};
}

if(isChecked("minecraft:enchantable")){
componentsOut["minecraft:enchantable"]={
slot:getValue("minecraft:enchantable_slot"),
value:Math.max(
0,
Math.floor(Number(getValue("minecraft:enchantable_value"))||0)
)
};
}

if(isChecked("minecraft:entity_placer")){
const entity=getValue("minecraft:entity_placer_entity").trim();

if(!entity){
alert("設置するエンティティを入力してください。");
return;
}

const entityPlacer={
entity
};

const useOn=csv(getValue("minecraft:entity_placer_useon"));
const dispenseOn=csv(getValue("minecraft:entity_placer_dispense"));

if(useOn.length){
entityPlacer.use_on=useOn;
}

if(dispenseOn.length){
entityPlacer.dispense_on=dispenseOn;
}

componentsOut["minecraft:entity_placer"]=entityPlacer;
}

if(isChecked("minecraft:food")){
if(!isChecked("minecraft:use_modifiers")){
alert("食べ物を使用するには「使用時間・移動速度」も有効にしてください。");
return;
}

const food={
nutrition:Math.max(
0,
Math.floor(Number(getValue("minecraft:food_nutrition"))||0)
),
saturation_modifier:Math.max(
0,
Number(getValue("minecraft:food_saturation"))||0
),
can_always_eat:isInputChecked("minecraft:food_always")
};

const convert=getValue("minecraft:food_convert").trim();

if(convert){
food.using_converts_to=convert;
}

componentsOut["minecraft:food"]=food;
}

if(isChecked("minecraft:fuel")){
let duration=Number(getValue("minecraft:fuel_duration"));

if(!Number.isFinite(duration))duration=80;

duration=Math.max(0.05,duration);

componentsOut["minecraft:fuel"]={
duration
};
}

if(isChecked("minecraft:hover_text_color")){
const color=getValue("minecraft:hover_text_color_value").trim();

if(color){
componentsOut["minecraft:hover_text_color"]=color;
}
}

if(isChecked("minecraft:interact_button")){
const mode=getValue("minecraft:interact_button_mode");

if(mode==="true"){
componentsOut["minecraft:interact_button"]=true;
}else{
componentsOut["minecraft:interact_button"]=
getValue("minecraft:interact_button_text")||"";
}
}

if(isChecked("minecraft:rarity")){
componentsOut["minecraft:rarity"]=
getValue("minecraft:rarity_value")||"common";
}

if(isChecked("minecraft:record")){
const record={};

const sound=getValue("minecraft:record_sound").trim();
const duration=Number(getValue("minecraft:record_duration"));
const comparator=Math.floor(
Number(getValue("minecraft:record_comparator"))||0
);

if(sound){
record.sound_event=sound;
}

if(Number.isFinite(duration)&&duration>0){
record.duration=duration;
}

if(comparator>=0){
record.comparator_signal=comparator;
}

componentsOut["minecraft:record"]=record;
}

if(isChecked("minecraft:repairable")){
const items=csv(getValue("minecraft:repairable_items"));

if(!items.length){
alert("修理アイテムを1つ以上入力してください。");
return;
}

const amount=Math.max(
0,
Number(getValue("minecraft:repairable_amount"))||0
);

componentsOut["minecraft:repairable"]={
repair_items:[
{
items,
repair_amount:amount
}
]
};
}

if(isChecked("minecraft:storage_item")){
const maxSlots=Math.max(
1,
Math.min(
64,
Math.floor(Number(getValue("minecraft:storage_item_slots"))||64)
)
);

const storage={
max_slots:maxSlots,
allow_nested_storage_items:
isInputChecked("minecraft:storage_item_nested")
};

const allowed=csv(getValue("minecraft:storage_item_allowed"));
const banned=csv(getValue("minecraft:storage_item_banned"));

if(allowed.length){
storage.allowed_items=allowed;
}

if(banned.length){
storage.banned_items=banned;
}

componentsOut["minecraft:storage_item"]=storage;
}

if(isChecked("minecraft:storage_weight_limit")){
componentsOut["minecraft:storage_weight_limit"]=
Math.max(
0,
Number(getValue("minecraft:storage_weight_limit_value"))||0
);
}

if(isChecked("minecraft:storage_weight_modifier")){
componentsOut["minecraft:storage_weight_modifier"]=
Math.max(
0,
Number(getValue("minecraft:storage_weight_modifier_value"))||0
);
}

if(isChecked("minecraft:swing_duration")){
componentsOut["minecraft:swing_duration"]=
Math.max(
0,
Number(getValue("minecraft:swing_duration_value"))||0
);
}

if(isChecked("minecraft:swing_sounds")){
const sounds={};

const attack=getValue("minecraft:swing_sounds_attack").trim();
const use=getValue("minecraft:swing_sounds_use").trim();

if(attack){
sounds.attack=attack;
}

if(use){
sounds.use=use;
}

componentsOut["minecraft:swing_sounds"]=sounds;
}

if(isChecked("minecraft:tags")){
const tags=csv(getValue("minecraft:tags_value"));

if(tags.length){
componentsOut["minecraft:tags"]={
tags
};
}
}

if(isChecked("minecraft:throwable")){
componentsOut["minecraft:throwable"]={
do_swing_animation:
isInputChecked("minecraft:throwable_swing"),
launch_power_scale:
Math.max(0,Number(getValue("minecraft:throwable_scale"))||1),
min_draw_duration:
Math.max(0,Number(getValue("minecraft:throwable_min_draw"))||0),
max_draw_duration:
Math.max(0,Number(getValue("minecraft:throwable_max_draw"))||0),
max_launch_power:
Math.max(0,Number(getValue("minecraft:throwable_max_power"))||1),
scale_power_by_draw_duration:
isInputChecked("minecraft:throwable_scale_draw")
};
}

if(isChecked("minecraft:use_animation")){
componentsOut["minecraft:use_animation"]=
getValue("minecraft:use_animation_value")||"none";
}

if(isChecked("minecraft:use_modifiers")){
const duration=Math.max(
0,
Number(getValue("minecraft:use_modifiers_duration"))||0
);

const movement=Math.min(
1,
Math.max(
0,
Number(getValue("minecraft:use_modifiers_movement"))||0
)
);

componentsOut["minecraft:use_modifiers"]={
use_duration:duration,
movement_modifier:movement,
emit_vibrations:
isInputChecked("minecraft:use_modifiers_vibrations")
};
}

if(isChecked("minecraft:wearable")){
const slot=getValue("minecraft:wearable_slot");

const wearable={
slot,
protection:Math.max(
0,
Math.floor(Number(getValue("minecraft:wearable_protection"))||0)
)
};

if(document.getElementById("minecraft:wearable_dispensable")?.checked){
wearable.dispensable=true;
}

if(document.getElementById("minecraft:wearable_hide_location")?.checked){
wearable.hides_player_location=true;
}

componentsOut["minecraft:wearable"]=wearable;

if(
slot!=="slot.weapon.mainhand"&&
slot!=="slot.weapon.offhand"
){
componentsOut["minecraft:max_stack_size"]=1;
}
}

if(isChecked("minecraft:block_placer")){
const block=getValue("minecraft:block_placer_block").trim();

if(!block){
alert("設置するブロックを入力してください。");
return;
}

const placer={
block
};

if(
versionGTE(format,"1.26.10")&&
isInputChecked("minecraft:block_placer_aligned")
){
placer.aligned_placement=true;
}

if(isInputChecked("minecraft:block_placer_replace")){
if(identifier!==block){
alert("「このアイテムをブロックのアイテムとして登録」を使う場合、アイテムIDとブロックIDを同じにしてください。");
return;
}
placer.replace_block_item=true;
}

const useOn=csv(getValue("minecraft:block_placer_useon"));

if(useOn.length){
if(useOn.length>256){
alert("設置可能ブロックは256個以内にしてください。");
return;
}
placer.use_on=useOn;
}

componentsOut["minecraft:block_placer"]=placer;
}

document.getElementById("result").textContent=
JSON.stringify(item,null,2);
}

document.getElementById("formatVersion").addEventListener(
"change",
renderComponents
);

document.getElementById("generate").addEventListener(
"click",
generate
);

document.getElementById("copy").addEventListener(
"click",
async()=>{
const text=document.getElementById("result").textContent;

try{
await navigator.clipboard.writeText(text);

const button=document.getElementById("copy");
const old=button.textContent;

button.textContent="コピーしました";

setTimeout(()=>{
button.textContent=old;
},1200);

}catch{
alert("コピーできませんでした。");
}
}
);

renderComponents();
</script>
