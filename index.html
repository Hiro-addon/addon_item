<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.container{
max-width:1000px;
margin:auto;
padding:24px 16px 50px
}

h1{
margin:0;
font-size:28px
}

.subtitle{
margin:6px 0 28px;
color:#888
}

.section{
background:#1a1a1a;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin-bottom:16px
}

.section h2{
margin:0 0 16px;
font-size:18px
}

.field{
margin-bottom:15px
}

.field:last-child{
margin-bottom:0
}

label{
display:block;
margin-bottom:7px;
color:#bbb;
font-size:14px
}

input,select{
width:100%;
padding:12px 14px;
border-radius:9px;
border:1px solid #333;
background:#111;
color:#fff;
outline:none;
font-size:15px
}

input:focus,select:focus{
border-color:#666
}

input::placeholder{
color:#777;
opacity:.55
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px
}

.component-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.component{
border:1px solid #333;
border-radius:10px;
background:#111;
overflow:hidden
}

.component.active{
border-color:#666
}

.component-head{
display:flex;
align-items:center;
gap:10px;
padding:12px
}

.component-head input{
width:18px;
height:18px;
padding:0;
margin:0
}

.component-name{
font-size:14px;
word-break:break-all
}

.component-version{
margin-left:auto;
font-size:11px;
color:#777;
white-space:nowrap
}

.component-body{
display:none;
padding:0 12px 12px
}

.component.active .component-body{
display:block
}

.component-body input,
.component-body select{
margin-bottom:8px
}

.component-body label{
margin-top:10px
}

.help{
font-size:11px;
color:#777;
margin-top:3px
}

.required{
background:#181818;
border:1px solid #333;
border-radius:10px;
padding:13px;
margin-bottom:10px
}

.required-title{
font-size:14px;
font-weight:bold;
margin-bottom:10px
}

.required-name{
font-size:12px;
color:#aaa;
margin-bottom:6px
}

.generate{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#fff;
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.result{
margin-top:16px
}

.result-box{
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
overflow:hidden
}

.result-title{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 14px;
border-bottom:1px solid #292929;
font-weight:bold
}

.copy-btn{
padding:7px 12px;
border:1px solid #444;
border-radius:7px;
background:#1a1a1a;
color:#fff;
cursor:pointer;
font-size:12px
}

pre{
margin:0;
padding:15px;
overflow-x:auto;
white-space:pre-wrap;
word-break:break-word;
color:#ddd;
font-size:13px;
line-height:1.6
}

.empty{
color:#777;
font-size:14px;
padding:10px 0
}

@media(max-width:700px){
.grid,.component-grid{
grid-template-columns:1fr
}

h1{
font-size:24px
}

.component-version{
display:none
}
}
</style>
</head>

</div>

<div class="section">
<h2>追加コンポーネント</h2>
<div id="components" class="component-grid"></div>
</div>

<div class="section">
<button class="generate" id="generate">Item JSONを生成</button>
</div>

<div id="result" class="result"></div>

</div>

function versionNumber(v){
return v.split(".").map(Number);
}

function versionAtLeast(current,min){
const a=versionNumber(current);
const b=versionNumber(min);

for(let i=0;i<3;i++){
const x=a[i]||0;
const y=b[i]||0;

if(x>y)return true;
if(x<y)return false;
}

return true;
}

function renderComponents(){
const current=document.getElementById("formatVersion").value;
const area=document.getElementById("components");

area.innerHTML="";

components
.filter(c=>versionAtLeast(current,c.min))
.forEach((c,index)=>{

const box=document.createElement("div");
box.className="component";

const head=document.createElement("div");
head.className="component-head";

const check=document.createElement("input");
check.type="checkbox";
check.dataset.index=index;

const name=document.createElement("div");
name.className="component-name";
name.textContent=c.id;

const ver=document.createElement("div");
ver.className="component-version";
ver.textContent="≥ "+c.min;

head.appendChild(check);
head.appendChild(name);
head.appendChild(ver);

const body=document.createElement("div");
body.className="component-body";

const help=document.createElement("div");
help.className="help";
help.textContent=c.help;

body.appendChild(help);

createFields(c,body);

box.appendChild(head);
box.appendChild(body);

check.onchange=()=>{
box.classList.toggle("active",check.checked);
};

area.appendChild(box);
});
}

function addInput(parent,labelText,value,type="text"){
const label=document.createElement("label");
label.textContent=labelText;

const input=document.createElement("input");
input.type=type;
input.value=value;

parent.appendChild(label);
parent.appendChild(input);

return input;
}

function addSelect(parent,labelText,options,value){
const label=document.createElement("label");
label.textContent=labelText;

const select=document.createElement("select");

options.forEach(option=>{
const o=document.createElement("option");
o.value=option;
o.textContent=option;
select.appendChild(o);
});

select.value=value;

parent.appendChild(label);
parent.appendChild(select);

return select;
}

function addCheckbox(parent,labelText,value){
const wrapper=document.createElement("label");
wrapper.style.display="flex";
wrapper.style.alignItems="center";
wrapper.style.gap="8px";

const input=document.createElement("input");
input.type="checkbox";
input.checked=value;
input.style.width="18px";
input.style.height="18px";

wrapper.appendChild(input);

const text=document.createElement("span");
text.textContent=labelText;

wrapper.appendChild(text);

parent.appendChild(wrapper);

return input;
}

function createFields(c,parent){

if(c.type==="boolean"){
const input=addCheckbox(parent,"有効にする",c.default);
input.dataset.field="value";
}

if(c.type==="block"){
const input=addInput(parent,"ブロックID",c.default);
input.dataset.field="block";
}

if(c.type==="number"){
const input=addInput(parent,"数値",c.default,"number");
input.dataset.field="value";
}

if(c.type==="text"){
const input=addInput(parent,"文字列",c.default);
input.dataset.field="value";
}

if(c.type==="color"){
const input=addInput(parent,"カラー",c.default.default_color);
input.dataset.field="default_color";
}

if(c.type==="entity"){
const input=addInput(parent,"エンティティID",c.default);
input.dataset.field="entity";
}

if(c.type==="animation"){
addSelect(
parent,
"アニメーション",
["none","eat","drink","bow","crossbow","block","camera"],
c.default
).dataset.field="value";
}

if(c.type==="rarity"){
addSelect(
parent,
"レアリティ",
["common","uncommon","rare","epic"],
c.default
).dataset.field="value";
}

if(c.type==="enchantable"){
addSelect(
parent,
"エンチャントスロット",
["sword","bow","pickaxe","armor_head","armor_torso","armor_legs","armor_feet"],
c.default.slot
).dataset.field="slot";

addInput(parent,"エンチャント値",c.default.value,"number").dataset.field="value";
}

if(c.type==="durability"){
addInput(parent,"最大耐久値",c.default.max_durability,"number").dataset.field="max_durability";
}

if(c.type==="food"){
addInput(parent,"満腹度",c.default.nutrition,"number").dataset.field="nutrition";
addInput(parent,"満腹度回復倍率",c.default.saturation_modifier,"number").dataset.field="saturation_modifier";
addCheckbox(parent,"満腹でも食べられる",c.default.can_always_eat).dataset.field="can_always_eat";
}

if(c.type==="cooldown"){
addInput(parent,"カテゴリ",c.default.category).dataset.field="category";
addInput(parent,"時間（秒）",c.default.duration,"number").dataset.field="duration";
}

if(c.type==="digger"){
addCheckbox(parent,"効率強化を使用",c.default.use_efficiency).dataset.field="use_efficiency";
}

if(c.type==="projectile"){
addInput(parent,"投射物エンティティ",c.default.projectile_entity).dataset.field="projectile_entity";
addInput(parent,"クリティカル最小値",c.default.minimum_critical_power,"number").dataset.field="minimum_critical_power";
}

if(c.type==="record"){
addInput(parent,"コンパレーター出力",c.default.comparator_signal,"number").dataset.field="comparator_signal";
addInput(parent,"再生時間",c.default.duration,"number").dataset.field="duration";
addInput(parent,"サウンドイベント",c.default.sound_event).dataset.field="sound_event";
}

if(c.type==="repairable"){
addInput(parent,"修理アイテム", "").dataset.field="repair_items";
}

if(c.type==="shooter"){
addInput(parent,"弾薬アイテム", "").dataset.field="ammunition";
addCheckbox(parent,"引くときにチャージ",c.default.charge_on_draw).dataset.field="charge_on_draw";
addInput(parent,"最大引き時間",c.default.max_draw_duration,"number").dataset.field="max_draw_duration";
addCheckbox(parent,"引き時間で威力変更",c.default.scale_power_by_draw_duration).dataset.field="scale_power_by_draw_duration";
}

if(c.type==="storage"){
addInput(parent,"最大スロット数",c.default.max_slots,"number").dataset.field="max_slots";
}

if(c.type==="throwable"){
addInput(parent,"投射威力倍率",c.default.launch_power_scale,"number").dataset.field="launch_power_scale";
addInput(parent,"最大投射威力",c.default.max_launch_power,"number").dataset.field="max_launch_power";
addInput(parent,"最小引き時間",c.default.min_draw_duration,"number").dataset.field="min_draw_duration";
addInput(parent,"最大引き時間",c.default.max_draw_duration,"number").dataset.field="max_draw_duration";
addCheckbox(parent,"投げるときに振りアニメーション",c.default.do_swing_animation).dataset.field="do_swing_animation";
addCheckbox(parent,"引き時間で威力変更",c.default.scale_power_by_draw_duration).dataset.field="scale_power_by_draw_duration";
}

if(c.type==="use_modifiers"){
addInput(parent,"使用時間",c.default.use_duration,"number").dataset.field="use_duration";
addInput(parent,"移動速度倍率",c.default.movement_modifier,"number").dataset.field="movement_modifier";
addCheckbox(parent,"振動を発生",c.default.emit_vibrations).dataset.field="emit_vibrations";
}

if(c.type==="tags"){
addInput(parent,"タグ（カンマ区切り）",c.default.join(",")).dataset.field="tags";
}

if(c.type==="empty"){
const text=document.createElement("div");
text.className="help";
text.textContent="追加設定はありません。";
parent.appendChild(text);
}

if(c.type==="json"){
const text=document.createElement("div");
text.className="help";
text.textContent="このコンポーネントは詳細設定が必要です。";
parent.appendChild(text);
}
}

function collectComponent(c,box){

const fields=box.querySelectorAll("[data-field]");

if(c.type==="boolean"){
return fields[0].checked;
}

if(c.type==="block"){
return{
block:fields[0].value.trim()
};
}

if(c.type==="number"){
return Number(fields[0].value);
}

if(c.type==="text"){
return{
value:fields[0].value
};
}

if(c.type==="color"){
return{
default_color:fields[0].value
};
}

if(c.type==="entity"){
return{
entity:fields[0].value.trim()
};
}

if(c.type==="animation"){
return{
value:fields[0].value
};
}

if(c.type==="rarity"){
return{
value:fields[0].value
};
}

if(c.type==="enchantable"){
return{
slot:fields[0].value,
value:Number(fields[1].value)
};
}

if(c.type==="durability"){
return{
max_durability:Number(fields[0].value)
};
}

if(c.type==="food"){
return{
nutrition:Number(fields[0].value),
saturation_modifier:Number(fields[1].value),
can_always_eat:fields[2].checked
};
}

if(c.type==="cooldown"){
return{
category:fields[0].value,
duration:Number(fields[1].value)
};
}

if(c.type==="digger"){
return{
destroy_speeds:[],
use_efficiency:fields[0].checked
};
}

if(c.type==="projectile"){
return{
projectile_entity:fields[0].value.trim(),
minimum_critical_power:Number(fields[1].value)
};
}

if(c.type==="record"){
return{
comparator_signal:Number(fields[0].value),
duration:Number(fields[1].value),
sound_event:fields[2].value
};
}

if(c.type==="repairable"){
const items=fields[0].value
.split(",")
.map(v=>v.trim())
.filter(Boolean);

return{
repair_items:items.length?[
{
items:items
}
]:[]
};
}

if(c.type==="shooter"){
const ammo=fields[0].value
.split(",")
.map(v=>v.trim())
.filter(Boolean);

return{
ammunition:ammo.length?[
{
item:ammo
}
]:[],
charge_on_draw:fields[1].checked,
max_draw_duration:Number(fields[2].value),
scale_power_by_draw_duration:fields[3].checked
};
}

if(c.type==="storage"){
return{
max_slots:Number(fields[0].value)
};
}

if(c.type==="throwable"){
return{
do_swing_animation:fields[4].checked,
launch_power_scale:Number(fields[0].value),
max_draw_duration:Number(fields[3].value),
max_launch_power:Number(fields[1].value),
min_draw_duration:Number(fields[2].value),
scale_power_by_draw_duration:fields[5].checked
};
}

if(c.type==="use_modifiers"){
return{
use_duration:Number(fields[0].value),
movement_modifier:Number(fields[1].value),
emit_vibrations:fields[2].checked
};
}

if(c.type==="tags"){
return{
tags:fields[0].value
.split(",")
.map(v=>v.trim())
.filter(Boolean)
};
}

if(c.type==="empty"){
return{};
}

if(c.type==="json"){
return{};
}

return{};
}

document.getElementById("formatVersion").onchange=renderComponents;

renderComponents();

document.getElementById("generate").onclick=()=>{

const formatVersion=document.getElementById("formatVersion").value;

let identifier=document.getElementById("identifier").value.trim();

if(!identifier){
identifier="hiro:test_item";
}

if(!identifier.includes(":")){
identifier="hiro:"+identifier;
}

let iconTexture=document.getElementById("iconTexture").value.trim();

if(!iconTexture){
iconTexture="test_item";
}

let maxStack=Number(document.getElementById("maxStack").value);

if(!Number.isFinite(maxStack)||maxStack<1){
maxStack=64;
}

maxStack=Math.min(64,Math.floor(maxStack));

const category=document.getElementById("category").value;
const group=document.getElementById("group").value.trim();

const description={
identifier:identifier
};

if(category!=="none"||group){
description.menu_category={
category:category
};

if(group){
description.menu_category.group=group;
}
}

const result={
format_version:formatVersion,
"minecraft:item":{
description:description,
components:{
"minecraft:icon":{
texture:iconTexture
},
"minecraft:max_stack_size":maxStack
}
}
};

document.querySelectorAll(".component").forEach(box=>{

const check=box.querySelector(".component-head input");

if(!check.checked)return;

const index=Number(check.dataset.index);
const component=components[index];

result["minecraft:item"].components[component.id]=collectComponent(component,box);

});

const output=JSON.stringify(result,null,2);

const resultArea=document.getElementById("result");

resultArea.innerHTML="";

const box=document.createElement("div");
box.className="result-box";

const title=document.createElement("div");
title.className="result-title";

const titleText=document.createElement("span");
titleText.textContent="アイテムJSON";

const copy=document.createElement("button");
copy.className="copy-btn";
copy.textContent="コピー";

copy.onclick=async()=>{
await navigator.clipboard.writeText(output);
copy.textContent="コピーしました";

setTimeout(()=>{
copy.textContent="コピー";
},1500);
};

title.appendChild(titleText);
title.appendChild(copy);

const pre=document.createElement("pre");
pre.textContent=output;

box.appendChild(title);
box.appendChild(pre);

resultArea.appendChild(box);

window.scrollTo({
top:resultArea.offsetTop-20,
behavior:"smooth"
});

};
</script>

</body>
</html>
