<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{margin:0;font-size:28px}
.subtitle{margin:6px 0 28px;color:#888}
.section{background:#1a1a1a;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{margin:0 0 16px;font-size:18px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label{display:block;margin-bottom:7px;color:#bbb;font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#666}
input::placeholder,textarea::placeholder{color:#777;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.component-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.component{border:1px solid #333;border-radius:10px;background:#111;overflow:hidden}
.component.active{border-color:#666}
.component-head{display:flex;align-items:center;gap:10px;padding:12px}
.component-head>input{width:18px;height:18px;padding:0;margin:0;flex:none}
.component-head>input:disabled{opacity:.25;cursor:not-allowed}
.component-name{font-size:14px;word-break:break-all}
.component-version{margin-left:auto;font-size:11px;color:#777;white-space:nowrap}
.component-body{display:none;padding:0 12px 12px}
.component.active .component-body{display:block}
.component-body input,.component-body select,.component-body textarea{margin-bottom:8px}
.component-body label{margin-top:10px}
.boolean-setting{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:8px;background:#181818;border:1px solid #292929}
.boolean-setting input{width:18px;height:18px;margin:0;padding:0}
.boolean-setting span{color:#fff;font-size:14px}
.help{font-size:11px;color:#777;margin-top:3px;line-height:1.5}
.required{background:#181818;border:1px solid #333;border-radius:10px;padding:13px;margin-bottom:10px}
.required-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.required-name{font-size:12px;color:#aaa;margin-bottom:6px}
.sub-title{font-size:13px;font-weight:bold;margin:14px 0 8px}
.digger-row{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin-bottom:8px;align-items:end}
.digger-label{font-size:11px;color:#777;margin-bottom:5px}
.digger-row input{margin:0}
.remove-row{width:42px;height:42px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:18px}
.add-row{width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff;cursor:pointer;font-size:13px}
.generate{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:16px}
.result-box{background:#0d0d0d;border:1px solid #292929;border-radius:12px;overflow:hidden}
.result-title{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #292929;font-weight:bold}
.copy-btn{padding:7px 12px;border:1px solid #444;border-radius:7px;background:#1a1a1a;color:#fff;cursor:pointer;font-size:12px}
pre{margin:0;padding:15px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px;line-height:1.6}
@media(max-width:700px){
.grid,.component-grid{grid-template-columns:1fr}
h1{font-size:24px}
.component-version{display:none}
.digger-row{grid-template-columns:1fr 110px 42px}
}
</style>

function versionNumber(v){
return v.split(".").map(Number);
}

function versionCompare(a,b){

const x=versionNumber(a);
const y=versionNumber(b);

for(let i=0;i<3;i++){

const xv=x[i]||0;
const yv=y[i]||0;

if(xv>yv)return 1;
if(xv<yv)return -1;

}

return 0;
}

function available(c,version){

if(versionCompare(version,c.min)<0)return false;

if(c.max&&versionCompare(version,c.max)>0)return false;

return true;
}

function splitValues(value){

return value
.split(",")
.map(v=>v.trim())
.filter(Boolean);

}

function addInput(parent,label,value,type="text",placeholder=""){

const wrap=document.createElement("div");
wrap.className="field";

const l=document.createElement("label");
l.textContent=label;

const input=document.createElement("input");

input.type=type;
input.value=value??"";
input.placeholder=placeholder;

wrap.appendChild(l);
wrap.appendChild(input);
parent.appendChild(wrap);

return input;
}

function addSelect(parent,label,options,value){

const wrap=document.createElement("div");
wrap.className="field";

const l=document.createElement("label");
l.textContent=label;

const select=document.createElement("select");

options.forEach(option=>{

const o=document.createElement("option");

o.value=option[0];
o.textContent=option[1];

select.appendChild(o);

});

select.value=value;

wrap.appendChild(l);
wrap.appendChild(select);
parent.appendChild(wrap);

return select;
}

function addCheckbox(parent,label,checked=false){

const wrap=document.createElement("div");
wrap.className="boolean-setting";

const input=document.createElement("input");

input.type="checkbox";
input.checked=checked;

const span=document.createElement("span");
span.textContent=label;

wrap.appendChild(input);
wrap.appendChild(span);
parent.appendChild(wrap);

return input;
}

function createDiggerRow(container,blockValue="",secondsValue=1){

const row=document.createElement("div");
row.className="digger-row";

const blockWrap=document.createElement("div");

const blockLabel=document.createElement("div");
blockLabel.className="digger-label";
blockLabel.textContent="対象ブロックID";

const block=document.createElement("input");

block.type="text";
block.placeholder="minecraft:stone,minecraft:dirt";
block.value=blockValue;
block.dataset.diggerField="block";

blockWrap.appendChild(blockLabel);
blockWrap.appendChild(block);

const timeWrap=document.createElement("div");

const timeLabel=document.createElement("div");
timeLabel.className="digger-label";
timeLabel.textContent="破壊時間（秒）";

const seconds=document.createElement("input");

seconds.type="number";
seconds.min="0.01";
seconds.step="0.01";
seconds.value=secondsValue;
seconds.dataset.diggerField="seconds";

timeWrap.appendChild(timeLabel);
timeWrap.appendChild(seconds);

const remove=document.createElement("button");

remove.type="button";
remove.className="remove-row";
remove.textContent="×";

remove.onclick=()=>{
row.remove();
};

row.appendChild(blockWrap);
row.appendChild(timeWrap);
row.appendChild(remove);

container.appendChild(row);

}

function updateComponentConflicts(){

const boxes=document.querySelectorAll(".component");

boxes.forEach(box=>{

const id=box.dataset.componentId;
const checkbox=box.querySelector(".component-head>input");

if(!checkbox)return;

const conflicts=componentConflicts[id]||[];

let disabled=false;

conflicts.forEach(conflictId=>{

const conflictBox=
document.querySelector(
`.component[data-component-id="${conflictId}"]`
);

if(!conflictBox)return;

const conflictCheckbox=
conflictBox.querySelector(
".component-head>input"
);

if(
conflictCheckbox&&
conflictCheckbox.checked
){
disabled=true;
}

});

checkbox.disabled=disabled;

if(disabled){

checkbox.checked=false;
box.classList.remove("active");

}

});

}

function renderComponents(){

const version=
document.getElementById("formatVersion").value;

const grid=
document.getElementById("componentGrid");

grid.innerHTML="";

components
.filter(c=>!c.hidden)
.filter(c=>available(c,version))
.forEach(c=>{

const box=document.createElement("div");
box.className="component";
box.dataset.componentId=c.id;

const head=document.createElement("div");
head.className="component-head";

const check=document.createElement("input");
check.type="checkbox";

const name=document.createElement("div");
name.className="component-name";
name.textContent=c.name;

const versionText=document.createElement("div");
versionText.className="component-version";

versionText.textContent=
c.max
?`${c.min}～${c.max}`
:`${c.min}～`;

head.appendChild(check);
head.appendChild(name);
head.appendChild(versionText);

const body=document.createElement("div");
body.className="component-body";

const help=document.createElement("div");
help.className="help";
help.textContent=c.help;

body.appendChild(help);

createFields(c,body);

box.appendChild(head);
box.appendChild(body);

check.addEventListener("change",()=>{

box.classList.toggle(
"active",
check.checked
);

updateComponentConflicts();

});

grid.appendChild(box);

});

updateComponentConflicts();

}

);

!box.querySelector(
".component-head>input"
)?.checked

function generate(){

const identifier=
document.getElementById("identifier")
.value.trim()||
"hiro:test_item";

const format_version=
document.getElementById("formatVersion")
.value;

const icon=
document.getElementById("iconTexture")
.value.trim()||
"test_item";

let maxStack=
Number(
document.getElementById("maxStack")
.value
);

if(!Number.isFinite(maxStack)){
maxStack=64;
}

maxStack=Math.max(
1,
Math.min(
64,
Math.floor(maxStack)
)
);

const category=
document.getElementById("category")
.value;

const group=
document.getElementById("group")
.value.trim();

const description={
identifier:identifier
};

if(
category!=="none"||
group
){

description.menu_category={};

if(category!=="none"){
description.menu_category.category=
category;
}

if(group){
description.menu_category.group=
group;
}

}

const outputComponents={

"minecraft:icon":{
texture:icon
},

"minecraft:max_stack_size":
maxStack

};

const selected=[];

document
.querySelectorAll(".component.active")
.forEach(box=>{

const id=
box.dataset.componentId;

const c=
components.find(
x=>x.id===id
);

if(!c)return;

selected.push({
id:id,
data:collectComponent(c,box)
});

});

const selectedIds=
selected.map(x=>x.id);

selected.forEach(item=>{
outputComponents[item.id]=item.data;
});

if(
selectedIds.includes("minecraft:food")&&
available(
components.find(
x=>x.id==="minecraft:use_modifiers"
),
format_version
)&&
!selectedIds.includes("minecraft:use_modifiers")
){

outputComponents["minecraft:use_modifiers"]={
use_duration:1.6,
movement_modifier:0.35
};

}

if(
selectedIds.includes("minecraft:shooter")
){

if(
available(
components.find(
x=>x.id==="minecraft:use_modifiers"
),
format_version
)&&
!selectedIds.includes("minecraft:use_modifiers")
){

outputComponents["minecraft:use_modifiers"]={
use_duration:1.6,
movement_modifier:0.35
};

}

if(
available(
components.find(
x=>x.id==="minecraft:projectile"
),
format_version
)&&
!selectedIds.includes("minecraft:projectile")
){

outputComponents["minecraft:projectile"]={
projectile_entity:"minecraft:arrow"
};

}

}

if(
selectedIds.includes("minecraft:throwable")&&
available(
components.find(
x=>x.id==="minecraft:projectile"
),
format_version
)&&
!selectedIds.includes("minecraft:projectile")
){

outputComponents["minecraft:projectile"]={
projectile_entity:"minecraft:arrow"
};

}

if(
selectedIds.includes("minecraft:wearable")
){

const wearable=
getSelectedComponent(
"minecraft:wearable"
);

if(
wearable&&
[
"slot.armor.head",
"slot.armor.chest",
"slot.armor.body",
"slot.armor.legs",
"slot.armor.feet"
].includes(wearable.slot)&&
format_version==="1.26.30"
){

outputComponents["minecraft:max_stack_size"]=maxStack;

}

}

const output={

format_version:format_version,

"minecraft:item":{

description:description,

components:outputComponents

}

};

document.getElementById("result")
.textContent=
JSON.stringify(
output,
null,
2
);

}

document
.getElementById("formatVersion")
.addEventListener(
"change",
renderComponents
);

document
.getElementById("generate")
.addEventListener(
"click",
generate
);

document
.getElementById("copy")
.addEventListener(
"click",
async()=>{

const text=
document.getElementById("result")
.textContent;

try{

await navigator.clipboard.writeText(text);

const button=
document.getElementById("copy");

const old=
button.textContent;

button.textContent="コピーしました";

setTimeout(()=>{
button.textContent=old;
},1200);

}catch{}

}
);

renderComponents();

</script>
</body>
</html>
